name: Witness Validation

on:
  workflow_dispatch:
    inputs:
      benchexec_url:
        description: 'URL of the benchexec run to validate'
        required: false
      esbmc_source:
        type: choice
        description: 'ESBMC binary source'
        options:
          - Download from benchexec run
          - Rebuild
      validator:
        type: choice
        description: 'Witness validator'
        options:
          - ESBMC
          - CPAChecker
      witness:
        type: choice
        description: 'Witness type to validate'
        options:
          - Full
          - Violation
          - Correctness
      mode:
        type: choice
        description: 'Validation scope'
        options:
          - Full
          - RunSet
          - Task
      runset:
        type: choice
        description: 'Run-set (only used when mode is RunSet)'
        options:
          - SV-COMP27_unreach-call
          - SV-COMP27_no-data-race
          - SV-COMP27_valid-memcleanup
          - SV-COMP27_valid-memsafety
          - SV-COMP27_no-overflow
          - SV-COMP27_termination
          - SV-COMP27_unreach-call_demo
          - SV-COMP27_no-data-race_demo
          - SV-COMP27_valid-memsafety_demo
          - SV-COMP27_no-overflow_demo
      task:
        type: choice
        description: 'Task (only used when mode is Task)'
        options:
          - C.unreach-call.Arrays
          - C.unreach-call.BitVectors
          - C.unreach-call.ControlFlow
          - C.unreach-call.ECA
          - C.unreach-call.Floats
          - C.unreach-call.Heap
          - C.unreach-call.Loops
          - C.unreach-call.ProductLines
          - C.unreach-call.Recursive
          - C.unreach-call.Sequentialized
          - C.unreach-call.XCSP
          - C.unreach-call.Cir2c
          - C.unreach-call.Combinations
          - C.unreach-call.Hardware
          - C.unreach-call.Hardness
          - C.unreach-call.Concurrency
          - C.unreach-call.SoftwareSystems-AWS-C-Common
          - C.unreach-call.SoftwareSystems-DeviceDriversLinux64
          - C.unreach-call.SoftwareSystems-DeviceDriversLinux64Large
          - C.unreach-call.SoftwareSystems-Other
          - C.unreach-call.SoftwareSystems-uthash
          - C.unreach-call.SoftwareSystems-Intel-TDX-Module
          - C.no-data-race.Concurrency
          - C.valid-memcleanup.Main
          - C.valid-memcleanup.SoftwareSystems-uthash
          - C.valid-memsafety.Arrays
          - C.valid-memsafety.Heap
          - C.valid-memsafety.LinkedLists
          - C.valid-memsafety.Other
          - C.valid-memsafety.Juliet
          - C.valid-memsafety.SoftwareSystems-coreutils
          - C.valid-memsafety.SoftwareSystems-DeviceDriversLinux64
          - C.valid-memsafety.SoftwareSystems-Other
          - C.valid-memsafety.SoftwareSystems-uthash
          - C.valid-memsafety.SoftwareSystems-Hacl-Star
          - C.valid-memsafety.Concurrency
          - C.no-overflow.Recursive
          - C.no-overflow.Memory
          - C.no-overflow.Bitvectors
          - C.no-overflow.ControlFlow
          - C.no-overflow.Juliet
          - C.no-overflow.SoftwareSystems-BusyBox
          - C.no-overflow.SoftwareSystems-coreutils
          - C.no-overflow.SoftwareSystems-uthash
          - C.no-overflow.SoftwareSystems-Other
          - C.no-overflow.Concurrency
          - C.no-overflow.SoftwareSystems-Hacl-Star
          - C.termination.BitVectors
          - C.termination.MainControlFlow
          - C.termination.MainHeap
          - C.termination.Other
          - C.termination.SoftwareSystems-DeviceDriversLinux64
          - C.termination.SoftwareSystems-uthash
          - C.unreach-call.Huawei-Concurrency-Challenges
          - C.no-data-race.Huawei-Concurrency-Challenges
          - C.valid-memsafety.Huawei-Concurrency-Challenges
          - C.no-overflow.Huawei-Concurrency-Challenges
          - C.unreach-call.CorrectnessWitnesses
          - C.unreach-call.ViolationWitnesses
          - C.termination.CorrectnessWitnesses
          - C.termination.ViolationWitnesses

jobs:
  build-esbmc:
    if: ${{ inputs.validator == 'ESBMC' && inputs.esbmc_source == 'Rebuild' }}
    uses: ./.github/workflows/aux-build.yml
    with:
      operating-system: ubuntu-24.04
      build-flags: '-b Release -e OFF -C'
      testing: false

  run-validation:
    runs-on: ['self-hosted', 'Linux', 'x64', 'benchexec']
    timeout-minutes: 12000
    needs: build-esbmc
    if: ${{ always() && !cancelled() && (needs.build-esbmc.result == 'success' || needs.build-esbmc.result == 'skipped') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: esbmc-src

      - name: Extract run ID from URL
        id: parse
        if: ${{ inputs.benchexec_url != '' }}
        run: |
          url="${{ inputs.benchexec_url }}"
          run_id=${url#*/runs/}; run_id=${run_id%%/*}
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download benchexec results
        if: ${{ inputs.benchexec_url != '' }}
        uses: actions/download-artifact@v8
        with:
          name: esbmc-result
          path: ./
          run-id: ${{ steps.parse.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Extract benchexec results
        if: ${{ inputs.benchexec_url != '' }}
        run: |
          rm -rf ./esbmc-output $HOME/esbmc-output
          unzip -q output.zip
          mv esbmc-output $HOME/esbmc-output

      - name: Download ESBMC binary (from benchexec run)
        if: ${{ inputs.validator == 'ESBMC' && inputs.esbmc_source == 'Download from benchexec run' }}
        uses: actions/download-artifact@v8
        with:
          name: 'release-ubuntu-24.04--b Release -e OFF -C'
          path: ./
          run-id: ${{ steps.parse.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download ESBMC binary (rebuilt)
        if: ${{ inputs.validator == 'ESBMC' && inputs.esbmc_source == 'Rebuild' }}
        uses: actions/download-artifact@v8
        with:
          name: 'release-ubuntu-24.04--b Release -e OFF -C'
          path: ./

      - name: Install ESBMC binary
        if: ${{ inputs.validator == 'ESBMC' }}
        run: |
          mkdir -p $HOME/output-action
          cp bin/esbmc $HOME/output-action/esbmc
          cp esbmc-src/scripts/competitions/svcomp/esbmc-wrapper.py $HOME/output-action/esbmc-wrapper.py
          chmod +x $HOME/output-action/esbmc $HOME/output-action/esbmc-wrapper.py

      - name: Run Validation (Full)
        if: ${{ inputs.mode == 'Full' }}
        run: ./esbmc-src/scripts/witness.sh -f
        env:
          WITNESS_OPTS: ${{ inputs.witness }}
          VALIDATOR: ${{ inputs.validator }}

      - name: Run Validation (RunSet)
        if: ${{ inputs.mode == 'RunSet' }}
        run: ./esbmc-src/scripts/witness.sh -r ${{ inputs.runset }}
        env:
          WITNESS_OPTS: ${{ inputs.witness }}
          VALIDATOR: ${{ inputs.validator }}

      - name: Run Validation (Task)
        if: ${{ inputs.mode == 'Task' }}
        run: ./esbmc-src/scripts/witness.sh -t ${{ inputs.task }}
        env:
          WITNESS_OPTS: ${{ inputs.witness }}
          VALIDATOR: ${{ inputs.validator }}

      - name: Show validation summary
        run: tail -v $HOME/witness-output/*results*.txt | sed -E 's|^==> .*/([^/.]+)\..* <==$|==> \1 <==|'

      - name: Move validation output
        run: mv $HOME/witness-output.zip ./witness-output.zip

      - uses: actions/upload-artifact@v7
        with:
          name: witness-result
          path: witness-output.zip

  generate-table:
    runs-on: ubuntu-slim
    needs: run-validation
    if: ${{ always() && needs.run-validation.result == 'success' }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install benchexec
        run: |
          pip install --user benchexec
          echo "$(python -m site --user-base)/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v6

      - name: Extract run ID from URL
        id: parse
        if: ${{ inputs.benchexec_url != '' }}
        run: |
          url="${{ inputs.benchexec_url }}"
          run_id=${url#*/runs/}; run_id=${run_id%%/*}
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download benchexec results
        if: ${{ inputs.benchexec_url != '' }}
        uses: actions/download-artifact@v8
        with:
          name: esbmc-result
          path: ./
          run-id: ${{ steps.parse.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Extract benchexec results
        if: ${{ inputs.benchexec_url != '' }}
        run: unzip output.zip || true

      - name: Download witness results
        uses: actions/download-artifact@v8
        with:
          name: witness-result
          path: ./

      - name: Extract witness results
        run: unzip witness-output.zip || true

      - name: Generate html table
        run: ./scripts/competitions/compare-runs.sh esbmc-output witness-output

      - uses: actions/upload-artifact@v7
        with:
          name: html-table
          path: |
            diff-esbmc-output-witness-output/
            esbmc-output/
            witness-output/

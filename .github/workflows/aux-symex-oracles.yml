name: Symex Oracles

# Tier-C metamorphic oracles for the goto-symex verification plan
# (docs/roadmap/goto-symex-verification-plan.md §7.4, §11.2). Each leg compares
# ESBMC against itself under a semantically-equivalent configuration and fails
# only on a divergence that is not already triaged in its baseline file.
#
# These are deliberately *not* per-PR checks: each leg runs the corpus twice, so
#
# A divergence is a real defect in one of the two configurations — the oracle
# cannot say which. Per §11.3 an untriaged divergence is a blocker, not a
# baseline: entries may only be added to a baseline file with a finding id or an
# issue link. STALE-BASELINE lines mean a listed test now agrees and the entry
# should be removed, so a fixed defect cannot silently keep its exemption.
#
#

on:
  workflow_call:

jobs:
  oracle:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: slice-parity
            args: --b=--no-slice
            suite: regression/esbmc
          - name: simplify-parity
            args: --b=--no-simplify
            suite: regression/esbmc
          - name: solver-parity
            args: --a=--bitwuzla --b=--z3
            suite: regression/esbmc
          - name: interval-guard-parity
            args: --b=--no-interval-symex-guard
            suite: regression/esbmc
          - name: incremental-equation-parity
            args: --b=--smt-during-symex
            suite: regression/esbmc
          - name: por-parity
            args: --b=--no-por
            suite: regression/esbmc-unix
          - name: state-hashing-parity
            args: --b=--state-hashing
            suite: regression/esbmc-unix
    steps:
      - uses: actions/checkout@v6

      - name: Build ESBMC
        run: ./scripts/build.sh -b RelWithDebInfo -e OFF -C

      - name: Run ${{ matrix.name }}
        run: |
          BASELINE=scripts/verification/symex/baselines/${{ matrix.name }}.txt
          test -f "$BASELINE" || BASELINE=/dev/null
          python3 scripts/verification/symex/oracle_flag_parity.py \
            --esbmc build/src/esbmc/esbmc \
            --suite ${{ matrix.suite }} \
            ${{ matrix.args }} \
            --timeout 60 \
            --baseline "$BASELINE" \
            | tee oracle-${{ matrix.name }}.log

      - name: Summarise
        if: always()
        run: |
          LOG=oracle-${{ matrix.name }}.log
          test -f "$LOG" || exit 0
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            grep -E '^(agreed|diverged|inconclusive|skipped|baselined)' "$LOG" || true
            grep -E '^(NEW-DIVERGENCE|STALE-BASELINE)' "$LOG" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-${{ matrix.name }}
          path: oracle-${{ matrix.name }}.log
          retention-days: 30
          if-no-files-found: warn

  unwind-monotonic:
    name: unwind-monotonicity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Build ESBMC
        run: ./scripts/build.sh -b RelWithDebInfo -e OFF -C

      - name: Run unwind monotonicity
        run: |
          python3 scripts/verification/symex/oracle_unwind_monotonic.py \
            --esbmc build/src/esbmc/esbmc \
            --bounds 1,2,4,8 \
            --timeout 60 \
            | tee oracle-unwind.log

      - name: Summarise
        if: always()
        run: |
          test -f oracle-unwind.log || exit 0
          {
            echo "### unwind-monotonicity"
            echo '```'
            grep -E '^(exercised|violations|inconclusive|LOST)' oracle-unwind.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-unwind
          path: oracle-unwind.log
          retention-days: 30
          if-no-files-found: warn

  claim-parity:
    name: claim-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Build ESBMC
        run: ./scripts/build.sh -b RelWithDebInfo -e OFF -C

      - name: Run claim parity
        run: |
          BASELINE=scripts/verification/symex/baselines/claim-parity.txt
          test -f "$BASELINE" || BASELINE=/dev/null
          python3 scripts/verification/symex/oracle_claim_parity.py \
            --esbmc build/src/esbmc/esbmc \
            --max-claims 12 \
            --timeout 60 \
            --baseline "$BASELINE" \
            | tee oracle-claim.log

      - name: Summarise
        if: always()
        run: |
          test -f oracle-claim.log || exit 0
          {
            echo "### claim-parity"
            echo '```'
            grep -E '^(compared|diverged|skipped|MISMATCH|NEW-DIVERGENCE|STALE-BASELINE)' oracle-claim.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-claim
          path: oracle-claim.log
          retention-days: 30
          if-no-files-found: warn

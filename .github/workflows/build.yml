name: Build ESBMC

on:
    # Sadly, there is no way to share the inputs between workflow_dispatch and workflow_call
    workflow_dispatch:
      inputs:
        operating-system:
            description: "Targeted OS (e.g. ubuntu-latest, windows-latest)"
            required: true
            type: string
        architecture:
            description: "Target architecture. armv8 is Linux only and selects the ubuntu-<version>-arm runner."
            required: false
            default: x86_64
            type: choice
            options:
              - x86_64
              - armv8
        build-flags:
            description: "Flags to be passed to build.sh script"
            required: true
            type: string
        testing:
            description: "Whether to run tests (regression) for this build"
            required: true
            type: boolean
        canon-names:
            description: "Upload the build as a canonical esbmc-<platform>.zip release asset"
            required: false
            default: false
            type: boolean
    workflow_call:
      inputs:
        operating-system:
            description: "Targeted OS (e.g. ubuntu-latest, windows-latest)"
            required: true
            type: string
        architecture:
            description: "Target architecture (x86_64 or armv8)"
            required: false
            default: x86_64
            type: string
        build-flags:
            description: "Flags to be passed to build.sh script"
            required: true
            type: string
        testing:
            description: "Whether to run tests (regression) for this build"
            required: true
            type: boolean
        canon-names:
            description: "Upload the build as a canonical esbmc-<platform>.zip release asset"
            required: false
            default: false
            type: boolean

jobs:
  # armv8 has a Linux runner image only: macOS runners are already arm64 and
  # build.ps1 fetches an x86_64 toolchain, so either combination would quietly
  # produce an x86_64 build labelled armv8.
  validate-platform:
    name: Validate platform
    runs-on: ubuntu-slim
    steps:
    - name: Reject non-Linux armv8
      if: ${{ inputs.architecture == 'armv8' && !startsWith(inputs.operating-system, 'ubuntu-') }}
      run: |
        echo "::error::armv8 builds are Linux only; got operating-system '${{ inputs.operating-system }}'."
        exit 1

  build-unix:
    needs: validate-platform
    if: ${{ !startsWith(inputs.operating-system, 'windows-') }}
    uses: ./.github/workflows/build-unix.yml
    with:
      operating-system: ${{ inputs.architecture == 'armv8' && format('{0}-arm', inputs.operating-system) || inputs.operating-system }}
      build-flags: ${{ inputs.build-flags }}
      testing: ${{ inputs.testing }}
      canon-names: ${{ inputs.canon-names }}

  build-windows:
    needs: validate-platform
    if: ${{ startsWith(inputs.operating-system, 'windows-') }}
    uses: ./.github/workflows/build-windows.yml
    with:
      operating-system: ${{ inputs.operating-system }}
      build-flags: ${{ inputs.build-flags }}
      testing: ${{ inputs.testing }}
      canon-names: ${{ inputs.canon-names }}

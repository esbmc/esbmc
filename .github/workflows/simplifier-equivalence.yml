name: Simplifier equivalence

# Builds ESBMC with -DENABLE_SIMPLIFIER_EQUIVALENCE_CHECK=ON and runs a slice
# of the CORE regression suite under it (esbmc/esbmc#4625). Every simplify()
# rewrite is proved equivalent by an SMT solver -- each per-node peephole,
# where it is made, since esbmc/esbmc#7260; before that the hook saw only whole
# expressions and a deliberately wrong fold passed unreported. A rewrite that
# changes meaning logs both expressions plus a witness and exits non-zero, so a
# failure here is a simplifier soundness bug, not a verdict change. A rewrite
# whose operand sorts stop agreeing is reported the same way -- it would abort
# any backend's mk_eq, so it is a defect whichever way it goes
# (esbmc/esbmc#7220). Shapes the check cannot state are declined, as are
# rewrites of expressions past a node budget -- one query per fold is quadratic
# on a long chain. Both are counted in the "N declined (M ill-sorted)" line the
# run prints, so a job that proved little says so.
#
# The check is compiled out of every other build, so without this job the
# enabled path is never built and would bit-rot. It runs on a schedule and on
# demand rather than per-PR: proving each rewrite costs an SMT query, which is
# orders of magnitude slower than a normal run.

on:
  workflow_dispatch:
  schedule:
    # 04:17 on Mondays -- off the hour to avoid the scheduler's rush.
    - cron: '17 4 * * 1'
  push:
    branches: [master]
    paths:
      - 'src/util/expr/expr_simplifier.cpp'
      - 'src/irep2/irep2_utils.h'
      - 'src/irep2/simplification_check.*'
      - 'src/solvers/smt/simplification_equivalence.*'
      - 'src/esbmc/parseoptions/driver.cpp'
      - 'unit/irep2/simplification_hook.test.cpp'
      - 'unit/solvers/simplification_equivalence.test.cpp'
      - 'regression/esbmc/simplifier_unsound_fold_probe/**'
      - 'scripts/plant_unsound_fold.py'
      - '.github/workflows/simplifier-equivalence.yml'

jobs:
  equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./scripts/build.sh -b Debug

      - name: Re-enable with the equivalence check
        # build.sh has no pass-through for extra CMake args, so the option is
        # turned on by reconfiguring the tree it produced.
        run: |
          cd build
          cmake -DENABLE_SIMPLIFIER_EQUIVALENCE_CHECK=On .
          cmake --build . -j2

      - name: Unit tests
        run: ctest --test-dir build -j2 -LE regression --output-on-failure

      # The slice below passes just as happily when the check proves nothing,
      # which is the state esbmc/esbmc#7260 found it in. So break the simplifier
      # on purpose and require the check to say so -- before the slice, which is
      # what the job's time budget cuts off first.
      - name: Prove the check would catch an unsound fold
        run: |
          set -eu
          python3 scripts/plant_unsound_fold.py plant src/util/expr/expr_simplifier.cpp
          cmake --build build -j2
          set +e
          ./build/src/esbmc/esbmc regression/esbmc/simplifier_unsound_fold_probe/main.c \
            > mutation.log 2>&1
          status=$?
          set -e
          python3 scripts/plant_unsound_fold.py remove src/util/expr/expr_simplifier.cpp
          # Rebuild before anything else runs: removing the fold from the source
          # leaves it in the binary, and every later step uses that binary. The
          # slice below reported 23 mul rewrites as unsound when this was
          # missing, all of them the planted fold (esbmc/esbmc#7327).
          cmake --build build -j2
          cat mutation.log
          if [ "$status" -eq 0 ]; then
            echo "::error::the planted unsound fold did not fail the run"
            exit 1
          fi
          grep -q 'simplifier changed the meaning of an expression' mutation.log \
            || { echo "::error::run failed, but not via the equivalence check"; exit 1; }

      - name: Regression slice under the equivalence check
        run: |
          cd build
          # Bounded, and the bound is a finding rather than a budget. 500 is
          # where the label's next test (github_1210-2-array) reports a
          # disagreement the check cannot arbitrate -- a `member` over a
          # bitcast/byte_update chain -- and github_1600 further on costs 1201s
          # against 8s uninstrumented. Both are esbmc/esbmc#7326; raise this when
          # they close. A violation exits the run, so one unscreened shape would
          # end the job before it reached anything after it.
          # 12_lms_new, inside the slice, is that same cost finding: 0.3s
          # uninstrumented, and past the 1200s per-test cap once every peephole
          # costs a query. Excluding it and dropping the bound to 499 leaves the
          # slice ending exactly where it did.
          ctest -j2 --output-on-failure -L '^esbmc/$' \
            -E 'regression/esbmc/12_lms_new$' -I 1,499

      # Not run here either: regression/floats/ and regression/floats-regression/.
      # The check finds a real simplifier bug there -- isnormal(+INFINITY)
      # folding to true (esbmc/esbmc#7320). Add both suites when it closes;
      # until then the bug is tracked rather than watched, and this comment is
      # the record of it. Its sibling, if(c, -0.0, +0.0) folding to -0.0
      # (esbmc/esbmc#7321), is fixed and the slice above covers it.

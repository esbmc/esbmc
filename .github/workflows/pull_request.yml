name: PR

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check testing tool suite
  testing-tool:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v6
    - name: Runs testing tool unit test
      run: cd regression && python3 testing_tool_test.py

  build-ubuntu:
    uses: ./.github/workflows/build-unix.yml
    name: static llvm-22 DebugOpt
    with:
      operating-system: ubuntu-24.04
      build-flags: '-b DebugOpt -e ON'
      testing: true

  build-windows:
    uses: ./.github/workflows/build-windows.yml
    name: static llvm-22 DebugOpt
    with:
      operating-system: windows-latest
      build-flags: '-b DebugOpt -e ON'
      testing: true

  # Goes through build.yml rather than build-unix.yml so the architecture input
  # and its runner-label mapping are covered too, not just the ARM build.
  build-ubuntu-armv8:
    uses: ./.github/workflows/build.yml
    name: static armv8 DebugOpt
    with:
      operating-system: ubuntu-24.04
      architecture: armv8
      build-flags: '-b DebugOpt -e ON'
      testing: true

  build-macos-arm:
    uses: ./.github/workflows/build-unix.yml
    name: arm64 darwin build
    with:
      operating-system: macos-latest
      build-flags: '-b DebugOpt -c 21 -e ON'
      testing: true

  # Check project with clang-format. This job no longer auto-commits fixes:
  # it only *checks* that the lines changed in the PR are formatted, and on
  # failure posts a comment explaining how to fix the already-committed lines
  # (scripts/install-format-hook.sh --fix) and how to install the local
  # pre-commit hook that prevents the failure next time.
  code-style:
    name: Check C/C++ code-style
    runs-on: ubuntu-slim
    permissions:
      # Read code; write only PR comments (no push / auto-commit).
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install libtinfo-dev
    - name: Download Clang 11
      run: wget https://github.com/llvm/llvm-project/releases/download/llvmorg-11.0.0/clang+llvm-11.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
    - name: Extract Clang 11
      run: tar xf clang+llvm-11.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz && mv clang+llvm-11.0.0-x86_64-linux-gnu-ubuntu-20.04 clang
    - name: Check formatting of changed lines
      id: fmt
      shell: bash
      run: |
        mapfile -t files < <(
          git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- src unit |
          grep -E '\.(h|c|cpp|hpp|hh)$' |
          grep -v '^src/ansi-c/cpp/' |
          grep -v '^src/clang-c-frontend/headers/' |
          grep -v '^src/c2goto/library/libm/musl/' || true
        )

        if [ "${#files[@]}" -eq 0 ]; then
          echo "No changed C/C++ files to format."
          exit 0
        fi

        # Format only the lines that differ from the base branch (not whole
        # files) and emit a diff instead of editing. A non-empty diff means
        # the PR touched lines that are not clang-format-11-clean.
        diff=$(python3 ./clang/bin/git-clang-format \
          --binary ./clang/bin/clang-format \
          --style file \
          --extensions h,c,cpp,hpp,hh \
          --diff \
          "origin/${{ github.base_ref }}" -- "${files[@]}")

        # git-clang-format prints these sentinels when nothing needs changing.
        if [ -z "$diff" ] || \
           [ "$diff" = "no modified files to format" ] || \
           [ "$diff" = "clang-format did not modify any files" ]; then
          echo "Changed lines are clang-format clean."
          exit 0
        fi

        echo "::error::Changed lines are not clang-format-11 clean."
        echo "$diff"
        {
          echo "diff<<DIFF_EOF"
          echo "$diff"
          echo "DIFF_EOF"
        } >> "$GITHUB_OUTPUT"
        exit 1
    - name: Comment with fix instructions
      if: ${{ failure() && steps.fmt.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: actions/github-script@v7
      with:
        script: |
          const diff = process.env.FMT_DIFF || '';
          const truncated = diff.length > 60000
            ? diff.slice(0, 60000) + '\n... (diff truncated) ...'
            : diff;
          const base = context.payload.pull_request.base.ref;
          // Hidden marker used only to identify our comments for cleanup once
          // the check passes (see the "Clean up ..." step). We still post a
          // fresh comment per failure rather than updating an old one.
          const marker = '<!-- esbmc-clang-format-check -->';
          const body = [
            marker,
            '### Code style check failed',
            '',
            'Some lines changed in this PR are not formatted with **clang-format 11**.',
            '',
            '**Fix the lines already committed** — reformat the changed lines with the same clang-format 11 CI uses, then commit and push:',
            '',
            '```sh',
            './scripts/install-format-hook.sh --fix origin/' + base,
            'git add -u && git commit -m "apply clang-format" && git push',
            '```',
            '',
            '**Avoid this next time** — install the pre-commit hook once; it formats changed lines automatically on every future commit:',
            '',
            '```sh',
            './scripts/install-format-hook.sh',
            '```',
            '',
            '<details><summary>Required formatting diff</summary>',
            '',
            '```diff',
            truncated,
            '```',
            '',
            '</details>',
          ].join('\n');

          // Always post a fresh comment (do not update an old one): if the
          // contributor keeps pushing unformatted code, a new comment each
          // time is harder to overlook than a silently-updated one.
          const { owner, repo } = context.repo;
          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number: context.payload.pull_request.number,
            body,
          });
      env:
        FMT_DIFF: ${{ steps.fmt.outputs.diff }}
    - name: Clean up stale code-style comments
      # On success, delete any failure comments left by earlier runs so a
      # fixed PR doesn't keep showing "check failed". Identified by the hidden
      # marker the comment step embeds.
      if: ${{ success() && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: actions/github-script@v7
      with:
        script: |
          const marker = '<!-- esbmc-clang-format-check -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(
            github.rest.issues.listComments,
            { owner, repo, issue_number });
          for (const c of comments) {
            if (c.body && c.body.includes(marker)) {
              await github.rest.issues.deleteComment(
                { owner, repo, comment_id: c.id });
            }
          }
    - name: Delete downloaded Clang 11
      if: always()
      run: rm -rf clang*


  # Check CMake files with cmakelint
  cmake-lint:
    name: Check CMake style (cmakelint)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install cmakelint
        run: pip install cmakelint
      - name: Run cmakelint on tracked CMake files
        shell: bash
        run: |
          mapfile -t files < <(
            git ls-files '*.cmake' 'CMakeLists.txt' '**/CMakeLists.txt' '**/*.cmake'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No CMake files to lint."
            exit 0
          fi
          cmakelint --config=.config/cmakelintrc "${files[@]}"


  # Fail when a goto-symex verification harness no longer matches the source it
  # transcribes (docs/roadmap/goto-symex-verification-plan.md §11.5).
  symex-harness-drift:
    name: Check goto-symex harness drift
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Run drift check
        run: python3 scripts/verification/symex/drift_check.py


  # Check project with YAPF
  python-style:
      name: Check Python code style (YAPF)
      runs-on: ubuntu-slim
      permissions:
        contents: write
      steps:
        - name: Checkout PR branch (not merge ref)
          uses: actions/checkout@v6
          with:
            ref: ${{ github.event.pull_request.head.sha }}
            fetch-depth: 0
            persist-credentials: true

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: '3.10'

        - name: Install YAPF
          run: pip install yapf

        - name: Apply YAPF formatting on changed files
          shell: bash
          run: |
            mapfile -t files < <(
              git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- src/python-frontend regression/python |
              grep -E '\.py$' || true
            )

            if [ "${#files[@]}" -eq 0 ]; then
              echo "No changed Python files to format."
              exit 0
            fi

            yapf --in-place "${files[@]}"

        - name: Auto-commit formatting changes
          uses: stefanzweifel/git-auto-commit-action@v7
          if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          with:
            commit_message: 'style(python): apply YAPF auto-formatting'
            file_pattern: |
              src/python-frontend/**/*.py
              regression/**/*.py
            commit_user_name: 'github-actions'
            commit_user_email: 'github-actions@github.com'
            skip_fetch: true
            skip_checkout: true

        - name: Throw error if changes were made (for forks)
          run: git diff --exit-code --ignore-cr-at-eol
          if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

  coverage:
    name: Build and upload coverage to Codecov
    runs-on: ['self-hosted', 'Linux', 'x64', 'cov']
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies and build with coverage
        env:
          LLVM_PROFILE_FILE: "/tmp/esbmc-coverage/coverage-%m_%p.profraw"
        run: ./scripts/build.sh -b Debug -k ON
      - name: Run tests
        env:
          LLVM_PROFILE_FILE: "/tmp/esbmc-coverage/coverage-%m_%p.profraw"
        # Minimal coverage suite (cov-regression) + all non-regression tests
        # (unit + other). Together they cover exactly the lines the full
        # regression suite covers (100% parity, line-level verified).
        run: |
          mkdir -p build/coverage && cd build/ && \
          { ctest -j32 --progress -LE regression || true; } && \
          { ctest -j32 --progress -L cov-regression || true; }
      - name: Map coverage files to instrumented binaries
        # Raw files are named coverage-<sig>_<n>_<pid>.profraw: %m gives the
        # binary's signature, %p one file per process. Re-run each
        # instrumented executable once with a hash-revealing template so the
        # signature can be matched back to its binary for per-binary export
        # (unit-test binaries count toward the total, fixing the old
        # esbmc-only counting gap).
        run: |
          set -euo pipefail
          mkdir -p /tmp/esbmc-coverage/hashmap
          bins="build/src/esbmc/esbmc"
          bins+=" $(find build/unit -type f -executable -not -name '*.so*' -not -name '*.a' | tr '\n' ' ')"
          for b in $bins; do
            name=$(echo "$b" | tr '/' '~')
            ( cd "$(dirname "$b")" && \
              LLVM_PROFILE_FILE="/tmp/esbmc-coverage/hashmap/${name}-%m.profraw" \
              timeout 15 "./$(basename "$b")" --cov-hash-probe >/dev/null 2>&1 || true )
          done
      - name: Merge per-binary coverage data
        # Group the per-process raws by binary signature and merge each
        # group in a single hop: re-merging an already-merged profile from
        # raws drops counters. --failure-mode=warn keeps one corrupt input
        # (a forked test child SIGKILLed mid-flush) from aborting its whole
        # group, which is the failure that voided the run in #7136.
        run: |
          set -uo pipefail
          mkdir -p /tmp/esbmc-coverage/groups
          for raw in /tmp/esbmc-coverage/coverage-*.profraw; do
            [ -e "$raw" ] || continue
            h=$(basename "$raw" .profraw)
            h=${h#coverage-}
            h=${h%_*} # drop the %p suffix, leaving the %m signature
            ls /tmp/esbmc-coverage/hashmap/*"-${h}"*.profraw >/dev/null 2>&1 || continue
            echo "$raw" >> "/tmp/esbmc-coverage/groups/${h}.list"
          done
          ok=0; empty=0
          for list in /tmp/esbmc-coverage/groups/*.list; do
            h=$(basename "$list" .list)
            pd="/tmp/esbmc-coverage/${h}.profdata"
            llvm-profdata merge -sparse --failure-mode=warn \
              --input-files="$list" -o "$pd" || { rm -f "$pd"; continue; }
            # Every input corrupt still exits 0, with an empty profile.
            if llvm-profdata show "$pd" 2>/dev/null |
                 grep -q '^Total functions: [1-9]'; then
              echo "$h: $(wc -l < "$list") raws"
              ok=$((ok+1))
            else
              echo "$h: no usable profile from $(wc -l < "$list") raws"
              rm -f "$pd"
              empty=$((empty+1))
            fi
          done
          echo "merged $ok binaries, $empty with no usable profile"
          [ "$ok" -gt 0 ]
      - name: Generate lcov coverage report
        # One llvm-cov export per binary (unit-test binaries included, fixing
        # the old esbmc-only counting gap), then a union of the DA records.
        # The union is plain text, not `lcov -a`: lcov sums counts in
        # doubles and mangles hot counters (>= 2^53) into exponential
        # notation, which Codecov rejects.
        run: |
          set -uo pipefail
          for pd in /tmp/esbmc-coverage/*.profdata; do
            h=$(basename "$pd" .profdata)
            m=$(ls /tmp/esbmc-coverage/hashmap/*"-${h}"*.profraw 2>/dev/null | head -1) || continue
            binpath=$(basename "$m" | sed "s/-${h}.*\.profraw//")
            binpath=$(echo "$binpath" | tr '~' '/')
            [ -x "$binpath" ] || { echo "binary missing: $binpath"; continue; }
            llvm-cov export -format=lcov -instr-profile="$pd" "$binpath" \
              > "/tmp/esbmc-coverage/${h}.lcov"
          done
          python3 - /tmp/esbmc-coverage/*.lcov > coverage.info <<'PYEOF'
          import sys
          covered = {}
          for path in sys.argv[1:]:
              sf = None
              for ln in open(path):
                  if ln.startswith("SF:"):
                      sf = ln[3:].strip()
                  elif ln.startswith("DA:") and sf:
                      line, _, count = ln[3:].strip().partition(",")
                      try:
                          hit = int(count) > 0
                      except ValueError:
                          hit = float(count) > 0
                      covered[(sf, line)] = covered.get((sf, line), False) or hit
          cur = None
          for (sf, line), hit in sorted(covered.items(),
                                         key=lambda kv: (kv[0][0], int(kv[0][1]))):
              if sf != cur:
                  if cur is not None:
                      print("end_of_record")
                  print(f"SF:{sf}")
                  cur = sf
              print(f"DA:{line},{1 if hit else 0}")
          if cur is not None:
              print("end_of_record")
          PYEOF
      - name: Filter out uninteresting paths
        run: |
          lcov --ignore-errors inconsistent --ignore-errors corrupt \
               --ignore-errors unused --remove coverage.info \
               '/usr/*' \
               '*/build/*' \
               --output-file coverage.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
      - name: Save coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.info
          retention-days: 5
      - name: Clean tmp files
        # Also on failure: a cancelled or failed run otherwise leaves its
        # profraw directory behind, and this runner's /tmp fills up.
        if: always()
        run: rm -rf /tmp/esbmc*

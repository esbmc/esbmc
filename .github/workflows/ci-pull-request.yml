name: PR

#
#

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-slim
    outputs:
      doxygen: ${{ steps.classify.outputs.doxygen }}
      ld: ${{ steps.classify.outputs.ld }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify the changed paths
        id: classify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --quiet origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "changed files:"
          echo "$files"

          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          gate() {
            if grep -qE "$2" <<<"$files"; then emit "$1" true; else emit "$1" false; fi
          }

          gate doxygen '^(\.config/Doxyfile|scripts/gen-docs\.sh|\.github/workflows/ci-pull-request\.yml)$'
          gate ld '^(src/ld-frontend/|tools/ld-verify/|regression/ld/|unit/ld-frontend/|src/esbmc/options\.cpp$|\.github/workflows/ci-pull-request\.yml$)'

  # Check testing tool suite
  testing-tool:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v6
    - name: Runs testing tool unit test
      run: cd regression && python3 testing_tool_test.py

  build-ubuntu:
    uses: ./.github/workflows/aux-build-unix.yml
    name: static llvm-22 DebugOpt
    with:
      operating-system: ubuntu-24.04
      build-flags: '-b DebugOpt -e ON'
      testing: true

  # Check project with clang-format. This job no longer auto-commits fixes:
  # it only *checks* that the lines changed in the PR are formatted, and on
  # failure posts a comment explaining how to fix the already-committed lines
  # (scripts/install-format-hook.sh --fix) and how to install the local
  # pre-commit hook that prevents the failure next time.
  code-style:
    name: Check C/C++ code-style
    runs-on: ubuntu-slim
    permissions:
      # Read code; write only PR comments (no push / auto-commit).
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install libtinfo-dev
    - name: Download Clang 11
      run: wget https://github.com/llvm/llvm-project/releases/download/llvmorg-11.0.0/clang+llvm-11.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz
    - name: Extract Clang 11
      run: tar xf clang+llvm-11.0.0-x86_64-linux-gnu-ubuntu-20.04.tar.xz && mv clang+llvm-11.0.0-x86_64-linux-gnu-ubuntu-20.04 clang
    - name: Check formatting of changed lines
      id: fmt
      shell: bash
      run: |
        mapfile -t files < <(
          git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- src unit |
          grep -E '\.(h|c|cpp|hpp|hh)$' |
          grep -v '^src/ansi-c/cpp/' |
          grep -v '^src/clang-c-frontend/headers/' |
          grep -v '^src/c2goto/library/libm/musl/' || true
        )

        if [ "${#files[@]}" -eq 0 ]; then
          echo "No changed C/C++ files to format."
          exit 0
        fi

        # Format only the lines that differ from the base branch (not whole
        # files) and emit a diff instead of editing. A non-empty diff means
        # the PR touched lines that are not clang-format-11-clean.
        diff=$(python3 ./clang/bin/git-clang-format \
          --binary ./clang/bin/clang-format \
          --style file \
          --extensions h,c,cpp,hpp,hh \
          --diff \
          "origin/${{ github.base_ref }}" -- "${files[@]}")

        # git-clang-format prints these sentinels when nothing needs changing.
        if [ -z "$diff" ] || \
           [ "$diff" = "no modified files to format" ] || \
           [ "$diff" = "clang-format did not modify any files" ]; then
          echo "Changed lines are clang-format clean."
          exit 0
        fi

        echo "::error::Changed lines are not clang-format-11 clean."
        echo "$diff"
        {
          echo "diff<<DIFF_EOF"
          echo "$diff"
          echo "DIFF_EOF"
        } >> "$GITHUB_OUTPUT"
        exit 1
    - name: Comment with fix instructions
      if: ${{ failure() && steps.fmt.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: actions/github-script@v7
      with:
        script: |
          const diff = process.env.FMT_DIFF || '';
          const truncated = diff.length > 60000
            ? diff.slice(0, 60000) + '\n... (diff truncated) ...'
            : diff;
          const base = context.payload.pull_request.base.ref;
          // Hidden marker used only to identify our comments for cleanup once
          // the check passes (see the "Clean up ..." step). We still post a
          // fresh comment per failure rather than updating an old one.
          const marker = '<!-- esbmc-clang-format-check -->';
          const body = [
            marker,
            '### Code style check failed',
            '',
            'Some lines changed in this PR are not formatted with **clang-format 11**.',
            '',
            '**Fix the lines already committed** — reformat the changed lines with the same clang-format 11 CI uses, then commit and push:',
            '',
            '```sh',
            './scripts/install-format-hook.sh --fix origin/' + base,
            'git add -u && git commit -m "apply clang-format" && git push',
            '```',
            '',
            '**Avoid this next time** — install the pre-commit hook once; it formats changed lines automatically on every future commit:',
            '',
            '```sh',
            './scripts/install-format-hook.sh',
            '```',
            '',
            '<details><summary>Required formatting diff</summary>',
            '',
            '```diff',
            truncated,
            '```',
            '',
            '</details>',
          ].join('\n');

          // Always post a fresh comment (do not update an old one): if the
          // contributor keeps pushing unformatted code, a new comment each
          // time is harder to overlook than a silently-updated one.
          const { owner, repo } = context.repo;
          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number: context.payload.pull_request.number,
            body,
          });
      env:
        FMT_DIFF: ${{ steps.fmt.outputs.diff }}
    - name: Clean up stale code-style comments
      # On success, delete any failure comments left by earlier runs so a
      # fixed PR doesn't keep showing "check failed". Identified by the hidden
      # marker the comment step embeds.
      if: ${{ success() && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: actions/github-script@v7
      with:
        script: |
          const marker = '<!-- esbmc-clang-format-check -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(
            github.rest.issues.listComments,
            { owner, repo, issue_number });
          for (const c of comments) {
            if (c.body && c.body.includes(marker)) {
              await github.rest.issues.deleteComment(
                { owner, repo, comment_id: c.id });
            }
          }
    - name: Delete downloaded Clang 11
      if: always()
      run: rm -rf clang*

  # Check CMake files with cmakelint
  cmake-lint:
    name: Check CMake style (cmakelint)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install cmakelint
        run: pip install cmakelint
      - name: Run cmakelint on tracked CMake files
        shell: bash
        run: |
          mapfile -t files < <(
            git ls-files '*.cmake' 'CMakeLists.txt' '**/CMakeLists.txt' '**/*.cmake'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No CMake files to lint."
            exit 0
          fi
          cmakelint --config=.config/cmakelintrc "${files[@]}"

  # Check project with YAPF
  python-style:
      name: Check Python code style (YAPF)
      runs-on: ubuntu-slim
      permissions:
        contents: write
      steps:
        - name: Checkout PR branch (not merge ref)
          uses: actions/checkout@v6
          with:
            ref: ${{ github.event.pull_request.head.sha }}
            fetch-depth: 0
            persist-credentials: true

        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: '3.10'

        - name: Install YAPF
          run: pip install yapf

        - name: Apply YAPF formatting on changed files
          shell: bash
          run: |
            mapfile -t files < <(
              git diff --name-only --diff-filter=d "origin/${{ github.base_ref }}...HEAD" -- src/python-frontend regression/python |
              grep -E '\.py$' || true
            )

            if [ "${#files[@]}" -eq 0 ]; then
              echo "No changed Python files to format."
              exit 0
            fi

            yapf --in-place "${files[@]}"

        - name: Auto-commit formatting changes
          uses: stefanzweifel/git-auto-commit-action@v7
          if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          with:
            commit_message: 'style(python): apply YAPF auto-formatting'
            file_pattern: |
              src/python-frontend/**/*.py
              regression/**/*.py
            commit_user_name: 'github-actions'
            commit_user_email: 'github-actions@github.com'
            skip_fetch: true
            skip_checkout: true

        - name: Throw error if changes were made (for forks)
          run: git diff --exit-code --ignore-cr-at-eol
          if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}

  coverage:
    name: Build and upload coverage to Codecov
    runs-on: ['self-hosted', 'Linux', 'x64', 'cov']
    steps:
      - name: Clean stale tmp files
        run: rm -rf /tmp/esbmc*
      - uses: actions/checkout@v6
      - name: Install dependencies and build with coverage
        env:
          LLVM_PROFILE_FILE: "/tmp/esbmc-coverage/coverage-%m_%p.profraw"
        run: ./scripts/build.sh -b Debug -k ON
      # The cov-regression manifest is a curated list, so mode filtering must
      # not second-guess it: build.sh -k ON turns CORE_REGRESSION_ONLY on, which
      # would silently drop the 56 selected tests that are THOROUGH.
      - name: Register every test mode for the coverage suite
        run: cmake -DCORE_REGRESSION_ONLY=Off build

      - name: Run tests
        env:
          LLVM_PROFILE_FILE: "/tmp/esbmc-coverage/coverage-%m_%p.profraw"
        # Minimal coverage suite (cov-regression) + all non-regression tests
        # (unit + other). Together they cover exactly the lines the full
        # regression suite covers (100% parity, line-level verified).
        run: |
          mkdir -p build/coverage && cd build/ && \
          { ctest -j32 --progress -LE regression || true; } && \
          { ctest -j32 --progress -L cov-regression || true; }
      - name: Map coverage files to instrumented binaries
        # Raw files are named coverage-<sig>_<n>_<pid>.profraw: %m gives the
        # binary's signature, %p one file per process. Re-run each
        # instrumented executable once with a hash-revealing template so the
        # signature can be matched back to its binary for per-binary export
        # (unit-test binaries count toward the total, fixing the old
        # esbmc-only counting gap).
        run: |
          set -euo pipefail
          mkdir -p /tmp/esbmc-coverage/hashmap
          bins="build/src/esbmc/esbmc"
          bins+=" $(find build/unit -type f -executable -not -name '*.so*' -not -name '*.a' | tr '\n' ' ')"
          for b in $bins; do
            name=$(echo "$b" | tr '/' '~')
            ( cd "$(dirname "$b")" && \
              LLVM_PROFILE_FILE="/tmp/esbmc-coverage/hashmap/${name}-%m.profraw" \
              timeout 15 "./$(basename "$b")" --cov-hash-probe >/dev/null 2>&1 || true )
          done
      - name: Merge per-binary coverage data
        # Group the per-process raws by binary signature and merge each
        # group in a single hop: re-merging an already-merged profile from
        # raws drops counters. --failure-mode=warn keeps one corrupt input
        # (a forked test child SIGKILLed mid-flush) from aborting its whole
        # group, which is the failure that voided the run in #7136.
        run: |
          set -uo pipefail
          mkdir -p /tmp/esbmc-coverage/groups
          for raw in /tmp/esbmc-coverage/coverage-*.profraw; do
            [ -e "$raw" ] || continue
            h=$(basename "$raw" .profraw)
            h=${h#coverage-}
            h=${h%_*} # drop the %p suffix, leaving the %m signature
            ls /tmp/esbmc-coverage/hashmap/*"-${h}"*.profraw >/dev/null 2>&1 || continue
            echo "$raw" >> "/tmp/esbmc-coverage/groups/${h}.list"
          done
          ok=0; empty=0
          for list in /tmp/esbmc-coverage/groups/*.list; do
            h=$(basename "$list" .list)
            pd="/tmp/esbmc-coverage/${h}.profdata"
            llvm-profdata merge -sparse --failure-mode=warn \
              --input-files="$list" -o "$pd" || { rm -f "$pd"; continue; }
            # Every input corrupt still exits 0, with an empty profile.
            if llvm-profdata show "$pd" 2>/dev/null |
                 grep -q '^Total functions: [1-9]'; then
              echo "$h: $(wc -l < "$list") raws"
              ok=$((ok+1))
            else
              echo "$h: no usable profile from $(wc -l < "$list") raws"
              rm -f "$pd"
              empty=$((empty+1))
            fi
          done
          echo "merged $ok binaries, $empty with no usable profile"
          [ "$ok" -gt 0 ]
      - name: Generate lcov coverage report
        # One llvm-cov export per binary (unit-test binaries included, fixing
        # the old esbmc-only counting gap), then a union of the DA records.
        # The union is plain text, not `lcov -a`: lcov sums counts in
        # doubles and mangles hot counters (>= 2^53) into exponential
        # notation, which Codecov rejects.
        run: |
          set -uo pipefail
          for pd in /tmp/esbmc-coverage/*.profdata; do
            h=$(basename "$pd" .profdata)
            m=$(ls /tmp/esbmc-coverage/hashmap/*"-${h}"*.profraw 2>/dev/null | head -1) || continue
            binpath=$(basename "$m" | sed "s/-${h}.*\.profraw//")
            binpath=$(echo "$binpath" | tr '~' '/')
            [ -x "$binpath" ] || { echo "binary missing: $binpath"; continue; }
            llvm-cov export -format=lcov -instr-profile="$pd" "$binpath" \
              > "/tmp/esbmc-coverage/${h}.lcov"
          done
          python3 - /tmp/esbmc-coverage/*.lcov > coverage.info <<'PYEOF'
          import sys
          covered = {}
          for path in sys.argv[1:]:
              sf = None
              for ln in open(path):
                  if ln.startswith("SF:"):
                      sf = ln[3:].strip()
                  elif ln.startswith("DA:") and sf:
                      line, _, count = ln[3:].strip().partition(",")
                      try:
                          hit = int(count) > 0
                      except ValueError:
                          hit = float(count) > 0
                      covered[(sf, line)] = covered.get((sf, line), False) or hit
          cur = None
          for (sf, line), hit in sorted(covered.items(),
                                         key=lambda kv: (kv[0][0], int(kv[0][1]))):
              if sf != cur:
                  if cur is not None:
                      print("end_of_record")
                  print(f"SF:{sf}")
                  cur = sf
              print(f"DA:{line},{1 if hit else 0}")
          if cur is not None:
              print("end_of_record")
          PYEOF
      - name: Filter out uninteresting paths
        run: |
          lcov --ignore-errors inconsistent --ignore-errors corrupt \
               --ignore-errors unused --remove coverage.info \
               '/usr/*' \
               '*/build/*' \
               --output-file coverage.info
      - name: Report line total
        run: lcov --summary coverage.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
      - name: Save coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.info
          retention-days: 5
      - name: Clean tmp files
        # Also on failure: a cancelled or failed run otherwise leaves its
        # profraw directory behind, and this runner's /tmp fills up.
        if: always()
        run: rm -rf /tmp/esbmc*

  complexity:
    name: Cyclomatic complexity
    runs-on: ubuntu-slim
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head (not the merge ref)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # Pinned: an unpinned parser is an unpinned metric.
      - name: Install lizard
        run: pip install lizard==1.23.0

      - name: Self-test the report script
        run: python3 scripts/complexity/test_ccn_report.py

      - name: Report complexity introduced by this PR
        # base_ref goes through the environment, not string interpolation: a
        # refname may contain shell metacharacters.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The checkout above brings down the head ref alone, so a PR stacked
          # on another branch has no remote-tracking ref for its base and
          # merge-base aborts -- failing the gate for a reason that has nothing
          # to do with complexity. Fetch the base, and fall back to master when
          # it is gone (a stacked base is often deleted once it merges).
          for ref in "$BASE_REF" master; do
            git fetch --no-tags --quiet origin \
              "+refs/heads/$ref:refs/remotes/origin/$ref" 2>/dev/null || true
          done
          base=$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null) \
            || base=$(git merge-base origin/master HEAD)
          echo "merge base: $base"
          python3 scripts/complexity/ccn_report.py \
            --base "$base" --gate \
            --json complexity.json --markdown complexity.md

      # Always available, including on fork PRs whose token cannot comment.
      # Guarded on the file: when an earlier step dies there is no report, and
      # three more red steps would only bury the real error.
      - name: Publish to the job summary
        if: ${{ always() && hashFiles('complexity.md') != '' }}
        run: cat complexity.md >> "$GITHUB_STEP_SUMMARY"

      # The calibration input for promoting this job to a required check.
      - name: Upload the full report
        if: ${{ always() && hashFiles('complexity.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: complexity-${{ github.run_number }}
          path: |
            complexity.json
            complexity.md
          retention-days: 30

      - name: Comment on the PR
        # Forks get a read-only token; the job summary above is their report.
        if: ${{ always() && hashFiles('complexity.md') != '' &&
                github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Update one comment rather than posting per push: unlike the
            // code-style check this is advisory, so repeated comments are spam.
            const marker = '<!-- esbmc-complexity-report -->';
            const body = marker + '\n' + fs.readFileSync('complexity.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }

  doxygen:
    needs: changes
    if: needs.changes.outputs.doxygen == 'true'
    runs-on: ubuntu-slim
    concurrency:
      group: doxygen-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Generate API documentation
        run: scripts/gen-docs.sh

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: doxygen-html
          path: docs/html
          if-no-files-found: error

  # The LD suites are invisible to the main PR matrix, which never enables
  # ENABLE_LD_FRONTEND. Without this job the front-end's only gate is that it
  # compiles — which is how the graphical resolver came to drop every rung path
  # containing a function block without a single test going red.
  regression-ld:
    needs: changes
    if: needs.changes.outputs.ld == 'true'
    name: Run regression/ld and ld-verify
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake ninja-build git wget curl \
            gcc-12 g++-12 g++-multilib libc6-dev-i386 \
            libboost-all-dev libgmp-dev libssl-dev \
            bison flex python3

      - name: Configure CMake (LD front-end with tests)
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDOWNLOAD_DEPENDENCIES=On \
            -DENABLE_BOOLECTOR=Off \
            -DENABLE_YICES=Off \
            -DENABLE_BITWUZLA=Off \
            -DENABLE_GOTO_CONTRACTOR=Off \
            -DENABLE_SOLIDITY_FRONTEND=Off \
            -DENABLE_JIMPLE_FRONTEND=Off \
            -DENABLE_PYTHON_FRONTEND=Off \
            -DENABLE_CSMITH=Off \
            -DENABLE_LD_FRONTEND=On \
            -DENABLE_Z3=On \
            -DBUILD_TESTING=On \
            -DENABLE_REGRESSION=On

      - name: Build esbmc, ld-verify and the LD unit tests
        run: |
          cmake --build build -j$(nproc) --target \
            esbmc ld-verify ld_parser_test ld_property_test ld_ir_gen_test

      # This is CI's only ENABLE_PYTHON_FRONTEND=Off build, so it is the only
      # place an option registered in a frontend-gated group but read by
      # unconditionally-built code shows up as missing (#7345). Asserting the
      # Python options are absent keeps the check honest: without it, a build
      # that silently enabled the Python frontend would pass for the wrong
      # reason.
      - name: Assert C-frontend options survive a Python-off build
        run: |
          help=$(./build/src/esbmc/esbmc --help)
          for opt in --clang-c-irep2-adjust --clang-c-irep2-adjust-only; do
            grep -q -- "$opt" <<<"$help" || {
              echo "::error::$opt missing from a Python-off build"; exit 1; }
          done
          grep -q -- --python-irep2-adjust <<<"$help" && {
            echo "::error::Python options present; this build is not Python-off"
            exit 1; }
          echo "C-frontend options present; Python options absent, as expected."

      # Catch2 registers unit tests by test-case name, so there is no label to
      # select the LD ones by; run their binaries directly.
      - name: Run LD front-end unit tests
        run: |
          for t in ld_parser_test ld_property_test ld_ir_gen_test; do
            ./build/unit/ld-frontend/"$t"
          done

      - name: Run regression/ld
        working-directory: build
        run: ctest -j4 --output-on-failure --progress -L 'ld/'

      - name: Run ld-verify runner tests
        working-directory: build
        run: ctest -j4 --output-on-failure --progress -L ld-verify

  build-linux-amd64:
    needs: changes
    if: needs.changes.outputs.ld == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout ESBMC-PLC+ fork
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake ninja-build git wget curl \
            gcc-12 g++-12 g++-multilib libc6-dev-i386 \
            libboost-all-dev libgmp-dev libssl-dev \
            bison flex python3

      - name: Configure CMake (minimal PLC+ build)
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDOWNLOAD_DEPENDENCIES=On \
            -DENABLE_BOOLECTOR=Off \
            -DENABLE_YICES=Off \
            -DENABLE_BITWUZLA=Off \
            -DENABLE_GOTO_CONTRACTOR=Off \
            -DBUILD_TESTING=Off \
            -DENABLE_REGRESSION=Off \
            -DENABLE_SOLIDITY_FRONTEND=Off \
            -DENABLE_JIMPLE_FRONTEND=Off \
            -DENABLE_PYTHON_FRONTEND=Off \
            -DENABLE_CSMITH=Off \
            -DENABLE_LD_FRONTEND=On \
            -DENABLE_Z3=On

      - name: Build ESBMC
        run: cmake --build build --target esbmc -j$(nproc)

      - name: Fix RPATH and bundle Z3 library
        run: |
          sudo apt-get install -y patchelf
          Z3_LIB=$(find build/Z3 -name "libz3.so" | head -1)
          echo "Found Z3 lib: $Z3_LIB"
          cp "$Z3_LIB" libz3.so
          patchelf --set-rpath /usr/local/lib build/src/esbmc/esbmc
          cp build/src/esbmc/esbmc esbmc-linux-amd64

      - name: Verify binary supports --ld-props
        run: |
          export LD_LIBRARY_PATH="$(pwd):$LD_LIBRARY_PATH"
          ./esbmc-linux-amd64 --version
          ./esbmc-linux-amd64 --help 2>&1 | grep -q "ld-props" && \
            echo "OK: --ld-props supported" || \
            (echo "FAIL: --ld-props not found in binary" && exit 1)

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: esbmc-linux-amd64
          path: |
            esbmc-linux-amd64
            libz3.so
          retention-days: 30

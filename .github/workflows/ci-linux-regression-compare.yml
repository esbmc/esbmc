name: Linux regression comparison

# Manual comparison for the migration to the parallel Linux PR regression:
# one build of the candidate commit feeds both the monolithic regression
# (baseline) and the shards, and the summary compares them test by test.
# It is never a required check and never cancels PR runs.
# See docs/ci/linux-regression.md.

on:
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: "Full 40-character SHA of the commit to build and compare"
        required: true
        type: string
      cold-build:
        description: "Build from an empty ccache, to measure a cold producer"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-regression-compare-${{ inputs.candidate-sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the candidate
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v6
    - name: Check the SHA and that it has the CI helpers
      env:
        CANDIDATE: ${{ inputs.candidate-sha }}
      run: |
        if [[ ! "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::candidate-sha must be a full lowercase 40-character SHA"; exit 1
        fi
        git fetch --no-tags --depth=1 origin "$CANDIDATE"
        git cat-file -e "$CANDIDATE^{commit}"
        if ! git cat-file -e "$CANDIDATE:scripts/ci/linux_tests.py"; then
          echo "::error::$CANDIDATE predates scripts/ci/linux_tests.py"; exit 1
        fi
        {
          echo "workflow commit: $GITHUB_SHA"
          echo "candidate commit: $CANDIDATE"
        } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: validate
    uses: ./.github/workflows/aux-build-unix.yml
    name: static llvm-22 DebugOpt
    with:
      operating-system: ubuntu-24.04
      build-flags: '-b DebugOpt -e ON'
      testing: true
      linux-test-layout: pr-bundle
      check-python-regressions: false
      restore-build-cache: ${{ !inputs.cold-build }}
      save-cache: false
      upload: false
      checkout-ref: ${{ inputs.candidate-sha }}

  shards:
    needs: build
    uses: ./.github/workflows/aux-test-linux.yml
    with:
      executors: ${{ needs.build.outputs.shard-executors }}
      bundle-artifact: ${{ needs.build.outputs.bundle-artifact }}
      bundle-sha256: ${{ needs.build.outputs.bundle-sha256 }}
      plan-digest: ${{ needs.build.outputs.plan-digest }}
      checkout-ref: ${{ inputs.candidate-sha }}

  baseline:
    needs: build
    uses: ./.github/workflows/aux-test-linux.yml
    with:
      executors: '["baseline"]'
      bundle-artifact: ${{ needs.build.outputs.bundle-artifact }}
      bundle-sha256: ${{ needs.build.outputs.bundle-sha256 }}
      plan-digest: ${{ needs.build.outputs.plan-digest }}
      checkout-ref: ${{ inputs.candidate-sha }}
      timeout-minutes: 350

  cpython-check:
    needs: validate
    name: Check Python regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.candidate-sha }}
    - name: Install the Python runtime
      run: scripts/ci/linux-runtime.sh python
    - name: Check Python regression tests
      run: ./scripts/check_python_tests.sh

  comparison-summary:
    name: Compare baseline and shards
    needs: [validate, build, shards, baseline, cpython-check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.candidate-sha }}
    - name: Download the reports
      uses: actions/download-artifact@v8
      with:
        pattern: linux-result-*
        path: results
    - name: Compare
      env:
        NEEDS: ${{ toJSON(needs) }}
        PLAN_DIGEST: ${{ needs.build.outputs.plan-digest }}
        SHA256: ${{ needs.build.outputs.bundle-sha256 }}
      run: |
        mkdir -p results
        python3 scripts/ci/linux_tests.py compare --results-dir results --needs "$NEEDS" \
          --required validate,build,shards,baseline,cpython-check \
          --plan-digest "$PLAN_DIGEST" --bundle-sha256 "$SHA256" \
          --summary "$GITHUB_STEP_SUMMARY"

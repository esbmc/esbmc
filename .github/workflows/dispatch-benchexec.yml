name: Run Benchexec
on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Timeout for each benchmarks (in seconds)'
        required: true
        default: '30'
      options:
        description: 'Command-line flags to pass via ESBMC_OPTS'
        required: false
        default: ''
      output:
        description: 'File output name (to keep the logs)'
        required: false
        default: ''
      svbenchmarks:
        description: 'Git branch, tag, or commit of SV-Benchmarks to use'
        required: true
        default: 'svcomp27-freeze'
      mode:
        type: choice
        description: Benchexec run mode
        options:
        - Full
        - Task
        - RunSet
      runset:
        type: choice
        description: Run-set to use (be sure to set mode to "RunSet")
        options:
        - SV-COMP27_unreach-call
        - SV-COMP27_no-data-race
        - SV-COMP27_valid-memcleanup
        - SV-COMP27_valid-memsafety
        - SV-COMP27_no-overflow
        - SV-COMP27_termination
        - SV-COMP27_arithmetic
        - SV-COMP27_assertion-safety
        - SV-COMP27_data-lookup
        - SV-COMP27_dynamic-typing
        - SV-COMP27_ConcurrencySafety
        - SV-COMP27_unreach-call_demo
        - SV-COMP27_no-data-race_demo
        - SV-COMP27_valid-memsafety_demo
        - SV-COMP27_no-overflow_demo
        - Custom
      task:
        type: choice
        description: Task to use Run-set to use (be sure to set mode to "Task")
        options:
        - C.unreach-call.Arrays
        - C.unreach-call.BitVectors
        - C.unreach-call.ControlFlow
        - C.unreach-call.ECA
        - C.unreach-call.Floats
        - C.unreach-call.Heap
        - C.unreach-call.Loops
        - C.unreach-call.ProductLines
        - C.unreach-call.Recursive
        - C.unreach-call.Sequentialized
        - C.unreach-call.XCSP
        - C.unreach-call.Cir2c
        - C.unreach-call.Combinations
        - C.unreach-call.Hardware
        - C.unreach-call.Hardness
        - C.unreach-call.Concurrency
        - C.unreach-call.SoftwareSystems-AWS-C-Common
        - C.unreach-call.SoftwareSystems-DeviceDriversLinux64
        - C.unreach-call.SoftwareSystems-DeviceDriversLinux64Large
        - C.unreach-call.SoftwareSystems-Other
        - C.unreach-call.SoftwareSystems-uthash
        - C.unreach-call.SoftwareSystems-Intel-TDX-Module
        - C.no-data-race.Concurrency
        - C.valid-memcleanup.Main
        - C.valid-memcleanup.SoftwareSystems-uthash
        - C.valid-memsafety.Arrays
        - C.valid-memsafety.Heap
        - C.valid-memsafety.LinkedLists
        - C.valid-memsafety.Other
        - C.valid-memsafety.Juliet
        - C.valid-memsafety.SoftwareSystems-coreutils
        - C.valid-memsafety.SoftwareSystems-DeviceDriversLinux64
        - C.valid-memsafety.SoftwareSystems-Other
        - C.valid-memsafety.SoftwareSystems-uthash
        - C.valid-memsafety.SoftwareSystems-Hacl-Star
        - C.valid-memsafety.Concurrency
        - C.no-overflow.Recursive
        - C.no-overflow.Memory
        - C.no-overflow.Bitvectors
        - C.no-overflow.ControlFlow
        - C.no-overflow.Juliet
        - C.no-overflow.SoftwareSystems-BusyBox
        - C.no-overflow.SoftwareSystems-coreutils
        - C.no-overflow.SoftwareSystems-uthash
        - C.no-overflow.SoftwareSystems-Other
        - C.no-overflow.Concurrency
        - C.no-overflow.SoftwareSystems-Hacl-Star
        - C.termination.BitVectors
        - C.termination.MainControlFlow
        - C.termination.MainHeap
        - C.termination.Other
        - C.termination.SoftwareSystems-DeviceDriversLinux64
        - C.termination.SoftwareSystems-uthash
        - Python.arithmetic.Type
        - Python.arithmetic.Semantics
        - Python.arithmetic.SoftwareSystems-Pyperformance
        - Python.arithmetic.SoftwareSystems-Boto3
        - Python.arithmetic.SoftwareSystems-Chromium-Dashboard
        - Python.arithmetic.SoftwareSystems-Vllm
        - Python.assertion-safety.Type
        - Python.assertion-safety.Semantics
        - Python.assertion-safety.SoftwareSystems-Pyperformance
        - Python.assertion-safety.SoftwareSystems-Boto3
        - Python.assertion-safety.SoftwareSystems-Chromium-Dashboard
        - Python.assertion-safety.SoftwareSystems-Vllm
        - Python.data-lookup.Type
        - Python.data-lookup.Semantics
        - Python.data-lookup.SoftwareSystems-Pyperformance
        - Python.data-lookup.SoftwareSystems-Boto3
        - Python.data-lookup.SoftwareSystems-Chromium-Dashboard
        - Python.data-lookup.SoftwareSystems-Vllm
        - Python.dynamic-typing.Type
        - Python.dynamic-typing.Semantics
        - Python.dynamic-typing.SoftwareSystems-Pyperformance
        - Python.dynamic-typing.SoftwareSystems-Boto3
        - Python.dynamic-typing.SoftwareSystems-Chromium-Dashboard
        - Python.dynamic-typing.SoftwareSystems-Vllm
        - C.unreach-call.Huawei-Concurrency-Challenges
        - C.no-data-race.Huawei-Concurrency-Challenges
        - C.valid-memsafety.Huawei-Concurrency-Challenges
        - C.no-overflow.Huawei-Concurrency-Challenges
      validate:
        description: "Run witness validation after benchexec"
        required: true
        type: boolean
      validator:
        type: choice
        description: "Witness validator to use (only used when validate is enabled)"
        options:
        - CPAChecker
        - ESBMC
      witness:
        type: choice
        description: "Witness run mode (only used when validate is enabled)"
        options:
        - Full
        - Correctness
        - Violation

jobs:
  build-unix:
    uses: ./.github/workflows/aux-build.yml
    with:
      operating-system: ubuntu-24.04
      build-flags: '-b Release -e OFF -C'
      testing: false

  run-benchexec:
    runs-on: ['self-hosted', 'Linux', 'x64', 'benchexec']
    timeout-minutes: 12000
    needs: build-unix
    steps:
      - name: Setup SV-Benchmarks version
        run: cd $HOME/sv-benchmarks && git fetch --all --tags --force && git checkout ${{ inputs.svbenchmarks }} && if [ "${{ inputs.svbenchmarks }}" == "main" ]; then git reset --hard origin/main; fi
      - name: Download Linux Build
        uses: actions/download-artifact@v8
        with:
          name: 'release-ubuntu-24.04--b Release -e OFF -C'
          path: ./
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: esbmc-src
      - name: Set up the custom runset
        if: ${{ inputs.mode == 'RunSet' && inputs.runset == 'Custom' }}
        run: cp ./esbmc-src/scripts/competitions/svcomp/custom-reach.set $HOME/sv-benchmarks/c/ && mv ./esbmc-src/scripts/competitions/svcomp/custom.xml ./esbmc-src/scripts/competitions/svcomp/esbmc.xml
      - name: Set up the Concurrency runset
        if: ${{ inputs.mode == 'RunSet' && inputs.runset == 'SV-COMP27_ConcurrencySafety' }}
        run: mv ./esbmc-src/scripts/competitions/svcomp/ConcurrencySafety.xml ./esbmc-src/scripts/competitions/svcomp/esbmc.xml
      - name: Run Benchexec (Full)
        if: ${{ inputs.mode == 'Full' }}
        run: ./esbmc-src/scripts/benchexec.sh -f
        env:
          TIMEOUT: ${{ inputs.timeout }}
          ESBMC_OPTS: ${{ inputs.options }}
      - name: Run Benchexec (ConcurrencyRunSet)
        if: ${{ inputs.mode == 'RunSet' && inputs.runset == 'SV-COMP27_ConcurrencySafety' }}
        run: ./esbmc-src/scripts/benchexec.sh -f
        env:
          TIMEOUT: ${{ inputs.timeout }}
          ESBMC_OPTS: ${{ inputs.options }}
      - name: Run Benchexec (RunSet)
        if: ${{ inputs.mode == 'RunSet'  && inputs.runset != 'SV-COMP27_ConcurrencySafety'}}
        run: ./esbmc-src/scripts/benchexec.sh -r ${{ inputs.runset }}
        env:
          TIMEOUT: ${{ inputs.timeout }}
          ESBMC_OPTS: ${{ inputs.options }}
      - name: Run Benchexec (Task)
        if: ${{ inputs.mode == 'Task' }}
        run: ./esbmc-src/scripts/benchexec.sh -t ${{ inputs.task }}
        env:
          TIMEOUT: ${{ inputs.timeout }}
          ESBMC_OPTS: ${{ inputs.options }}
      - name: Show summary (ESBMC)
        run: tail $HOME/esbmc-output/*results*.txt
      - name: Show the marginal band (ESBMC)
        # Tasks finishing within 5% of the limit flip on any timing change, in
        # either direction, and read as a regression in the score when they do
        # (esbmc/esbmc#6831). Report them next to the summary so a score move
        # can be attributed without re-running the set.
        continue-on-error: true
        run: |
          python3 ./esbmc-src/scripts/competitions/svcomp/marginal_timeouts.py \
            $HOME/esbmc-output/*results*.xml.bz2
      - name: Save logs
        if: ${{ inputs.output != '' }}
        run: cp $HOME/output.zip $HOME/${{ inputs.output }}
      - name: Move output
        run: mv $HOME/output.zip ./output.zip
      - name: Debug Info
        run: ls
      - uses: actions/upload-artifact@v7
        with:
          name: esbmc-result
          path: output.zip
      # benchexec.sh does not propagate benchexec's exit status, so a run that
      # aborts before any task (e.g. "Memory banks ... do not have enough memory
      # for all runs") still passed with an artifact holding only the header.
      - name: Fail if benchexec produced no results
        run: |
          if ! ls "$HOME"/esbmc-output/*results*.xml.bz2 > /dev/null 2>&1; then
            echo "::error::benchexec wrote no results XML; see the Run Benchexec step"
            exit 1
          fi
      - name: Checkout code for validation
        if: ${{ inputs.validate == true }}
        uses: actions/checkout@v6
        with:
          path: esbmc-src
      - name: Run Validation (Full)
        if: ${{ inputs.validate == true && inputs.mode == 'Full' }}
        run: ./esbmc-src/scripts/witness.sh -f
        env:
          WITNESS_OPTS: ${{ inputs.witness }}
          VALIDATOR: ${{ inputs.validator }}
      - name: Run Validation (RunSet)
        if: ${{ inputs.validate == true && inputs.mode == 'RunSet' }}
        run: ./esbmc-src/scripts/witness.sh -r ${{ inputs.runset }}
        env:
          WITNESS_OPTS: ${{ inputs.witness }}
          VALIDATOR: ${{ inputs.validator }}
      - name: Run Validation (Task)
        if: ${{ inputs.validate == true && inputs.mode == 'Task' }}
        run: ./esbmc-src/scripts/witness.sh -t ${{ inputs.task }}
        env:
          WITNESS_OPTS: ${{ inputs.witness }}
          VALIDATOR: ${{ inputs.validator }}
      - name: Move validation output
        if: ${{ inputs.validate == true }}
        run: mv $HOME/witness-output.zip ./witness-output.zip
      - name: Show validation summary
        if: ${{ inputs.validate == true }}
        run: tail -v $HOME/witness-output/*results*.txt | sed -E 's|^==> .*/([^/.]+)\..* <==$|==> \1 <==|'
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.validate == true }}
        with:
          name: witness-result
          path: witness-output.zip

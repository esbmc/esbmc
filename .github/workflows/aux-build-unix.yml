on:
  workflow_call:
    inputs:
      operating-system:
        description: "Targeted OS (e.g. ubuntu-latest, windows-latest)"
        required: true
        type: string
      build-flags:
        description: "Flags to be passed to build.sh script"
        required: true
        type: string
      testing:
        description: "Whether to run tests (regression) for this build"
        required: true
        type: boolean
      canon-names:
        description: "Upload the build as a canonical esbmc-<platform>.zip release asset"
        required: false
        default: false
        type: boolean
      upload:
        description: "Upload ./release under its flag-qualified artifact name"
        required: false
        default: true
        type: boolean
      save-cache:
        description: "Save the ccache for later runs to restore"
        required: false
        default: false
        type: boolean
      test-shard:
        description: "Linux PR test selection: python, numpy, pyother, rest, or empty for all"
        required: false
        default: ''
        type: string
      linker:
        description: "ESBMC_LINKER passed to build.sh; auto keeps the probe"
        required: false
        default: auto
        type: string

jobs:
  build:
    name: Build ESBMC (${{ inputs.operating-system }})
    runs-on: ${{ inputs.operating-system }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      # Runner images are rebuilt weekly; mtime would invalidate every entry.
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1.5G
      # Without these every target reusing util_esbmc's PCH is uncacheable.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_KEY: ccache-${{ inputs.operating-system }}-${{ inputs.build-flags }}
    steps:
    - uses: actions/checkout@v6

    - name: Restore ccache
      uses: actions/cache/restore@v6
      with:
        path: .cache/ccache
        key: ${{ env.CCACHE_KEY }}-${{ github.sha }}
        restore-keys: ${{ env.CCACHE_KEY }}-

    - name: Build ESBMC
      run: ./scripts/build.sh ${{ inputs.build-flags }} ${{ inputs.linker != 'auto' && format('-l {0}', inputs.linker) || '' }}

    # Zeroed before saving, so the next restore reports only its own build.
    - name: Show ccache statistics
      run: |
        ccache --show-stats
        ccache --zero-stats

    - name: Save ccache
      if: ${{ inputs.save-cache }}
      uses: actions/cache/save@v6
      with:
        path: .cache/ccache
        key: ${{ env.CCACHE_KEY }}-${{ github.sha }}

    # Default: upload the raw ./release folder under the flag-qualified name that
    # downstream jobs (benchexec, sv-comp, witness-validation) download verbatim.
    - name: Upload build artifact
      if: ${{ inputs.upload && !inputs.canon-names }}
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.operating-system }}-${{ inputs.build-flags }}
        path: ./release

    # Release pipeline (canon-names): emit a canonical esbmc-<platform>.zip so the
    # published asset resolves to releases/latest/download/esbmc-<platform>.zip.
    - name: Package canonical release asset
      if: ${{ inputs.canon-names }}
      run: |
        case "${{ inputs.operating-system }}" in
          ubuntu*-arm) platform=linux-armv8 ;;
          ubuntu*)     platform=linux ;;
          macos*)      platform=macos ;;
          *)           platform="${{ inputs.operating-system }}" ;;
        esac
        echo "PLATFORM=$platform" >> "$GITHUB_ENV"
        zip -r "esbmc-$platform.zip" ./release
    - name: Upload canonical release asset
      if: ${{ inputs.canon-names }}
      uses: actions/upload-artifact@v7
      with:
        name: esbmc-${{ env.PLATFORM }}
        path: esbmc-${{ env.PLATFORM }}.zip
    
    - name: Check Python regression tests
      if: ${{ inputs.testing == true && (inputs.test-shard == '' || inputs.test-shard == 'python') }}
      run: |
        # Set PATH to include Python 3.12 and user-installed tools (mypy, meson, etc.)
        export PATH="$(brew --prefix python@3.12)/bin:$HOME/Library/Python/3.12/bin:$PATH"
        chmod +x scripts/check_python_tests.sh
        ./scripts/check_python_tests.sh

    - name: Run tests
      if: ${{ inputs.testing == true }}
      run: |
        # Set PATH to include Python 3.12 and user-installed tools (mypy, meson, etc.)
        export PATH="$(brew --prefix python@3.12)/bin:$HOME/Library/Python/3.12/bin:$PATH"
        cd build/
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          # Runner loss leaves no log (#10866); sample resources to show the cause.
          ( while sleep 5; do echo "[sample] $(date -u +%T) $(df -h / | awk 'NR==2{print $4" free"}') inodes $(df -i / | awk 'NR==2{print $5}') $(free -m | awk 'NR==2{print $7" MB avail"}') load $(cut -d' ' -f1 /proc/loadavg) procs $(ps -e --no-headers | wc -l) zombies $(ps -eo stat= | grep -c '^Z') threads $(ps -eLf --no-headers | wc -l) fds $(cut -f1 /proc/sys/fs/file-nr) tmp $(find /tmp -maxdepth 1 | wc -l) top $(ps -eo rss=,args= --sort=-rss | head -1 | cut -c1-80)"; done ) &
        fi
        # Cap the per-test TIMEOUT property at 120s. ctest --timeout is ignored
        # when tests set TIMEOUT via set_tests_properties (regression/CMakeLists.txt),
        # so we override the cache variable that feeds it and reconfigure.
        # KNOWNBUG tests that never converge grow ~1GB per 5s until that
        # timeout, so cap each test's address space to fit -jN of them in the
        # 16GB runner (#10866). A capped KNOWNBUG test still passes.
        mem_mb=8192
        case "${{ inputs.test-shard }}" in
          python)        mem_mb=6144 ;;
          numpy|pyother) mem_mb=4096 ;;
        esac
        cmake -DESBMC_REGRESS_TIMEOUT=120 -DESBMC_REGRESS_MEMORY_LIMIT=$mem_mb .
        # macOS PR: the python/ suite (anchored — excludes python-intensive
        # and python-coverage, which already run on Linux), plus the
        # platform-sensitive set. The Python frontend is the one part of ESBMC
        # whose toolchain materially differs across OSes (Homebrew Python,
        # stdlib paths); the rest of the regression suite is platform-portable
        # and covered by the Linux PR job. The exception is behaviour that is
        # genuinely OS-specific — resource limits, threading, signals, memory
        # mapping, filesystem semantics — which passes on Linux and fails on
        # macOS with no signal from CI (#6619). Tests covering that opt in via
        # ESBMC_PLATFORM_SENSITIVE_TESTS in regression/CMakeLists.txt.
        # On PR Linux, skip python-intensive to keep fast feedback.
        # On other systems/events (push, dispatch), run everything.
        #
        # About 90 tests peak at 1-8GB RSS (regression/MEMORY_COST); two aligned
        # 8GB ones exhaust a 16GB runner ("runner received a shutdown signal").
        # Each carries a RESOURCE_GROUPS "mem" cost in GB, and the Linux legs
        # give ctest a budget of available RAM minus 1GB per slot for the
        # untagged tests (all under 1GB). The floor of 8 matches the per-test
        # 8GB RLIMIT_AS, so the largest test can always be scheduled.
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          # The Python shards keep the -jN their per-test cap is sized for.
          case "${{ inputs.test-shard }}" in
            python)        jobs=2 ;;
            numpy|pyother) jobs=3 ;;
            *)             jobs=4 ;;
          esac
          mem=$(( $(awk '/MemAvailable/{print $2}' /proc/meminfo) / 1048576 - jobs ))
          (( mem < 8 )) && mem=8
          echo "ctest mem budget: ${mem}GB at -j${jobs}"
          printf '{"version":{"major":1,"minor":0},"local":[{"mem":[{"id":"0","slots":%d}]}]}\n' "$mem" > mem-spec.json
          linux_args=(-j"$jobs" --resource-spec-file mem-spec.json)
        fi
        if [[ "${{ inputs.operating-system }}" =~ ^macos ]]; then
          ctest -j4 --output-on-failure --progress -L '^python/$|^platform-sensitive$'
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          # Python-frontend suites run in their own shards (#10866).
          py='^(python|numpy|quixbugs|humaneval|typeevalpy)/$'
          case "${{ inputs.test-shard }}" in
            python)  ctest "${linux_args[@]}" --output-on-failure --progress -L '^python/$' -LE python-intensive . ;;
            numpy)   ctest "${linux_args[@]}" --output-on-failure --progress -L '^numpy/$' -LE python-intensive . ;;
            pyother) ctest "${linux_args[@]}" --output-on-failure --progress -L '^(quixbugs|humaneval|typeevalpy)/$' -LE python-intensive . ;;
            rest)    ctest "${linux_args[@]}" --output-on-failure --progress -LE "$py|python-intensive" . ;;
            *)       ctest "${linux_args[@]}" --output-on-failure --progress -LE python-intensive . ;;
          esac
        else
          ctest "${linux_args[@]}" --output-on-failure --progress .
        fi

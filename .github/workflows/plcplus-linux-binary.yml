name: Build ESBMC-PLC+ Linux binary

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/ld-frontend/**'
      - 'tools/ld-verify/**'
      - 'regression/ld/**'
      - 'unit/ld-frontend/**'
      - 'src/esbmc/options.cpp'
      - '.github/workflows/plcplus-linux-binary.yml'
  pull_request:
    paths:
      - 'src/ld-frontend/**'
      - 'tools/ld-verify/**'
      - 'regression/ld/**'
      - 'unit/ld-frontend/**'
      - 'src/esbmc/options.cpp'
      - '.github/workflows/plcplus-linux-binary.yml'

jobs:
  # The LD suites are invisible to the main PR matrix, which never enables
  # ENABLE_LD_FRONTEND. Without this job the front-end's only gate is that it
  # compiles — which is how the graphical resolver came to drop every rung path
  # containing a function block without a single test going red.
  regression-ld:
    name: Run regression/ld and ld-verify
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake ninja-build git wget curl \
            gcc-12 g++-12 g++-multilib libc6-dev-i386 \
            libboost-all-dev libgmp-dev libssl-dev \
            bison flex python3

      - name: Configure CMake (LD front-end with tests)
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDOWNLOAD_DEPENDENCIES=On \
            -DENABLE_BOOLECTOR=Off \
            -DENABLE_YICES=Off \
            -DENABLE_BITWUZLA=Off \
            -DENABLE_GOTO_CONTRACTOR=Off \
            -DENABLE_SOLIDITY_FRONTEND=Off \
            -DENABLE_JIMPLE_FRONTEND=Off \
            -DENABLE_PYTHON_FRONTEND=Off \
            -DENABLE_CSMITH=Off \
            -DENABLE_LD_FRONTEND=On \
            -DENABLE_Z3=On \
            -DBUILD_TESTING=On \
            -DENABLE_REGRESSION=On

      - name: Build esbmc, ld-verify and the LD unit tests
        run: |
          cmake --build build -j$(nproc) --target \
            esbmc ld-verify ld_parser_test ld_property_test ld_ir_gen_test

      # This is CI's only ENABLE_PYTHON_FRONTEND=Off build, so it is the only
      # place an option registered in a frontend-gated group but read by
      # unconditionally-built code shows up as missing (#7345). Asserting the
      # Python options are absent keeps the check honest: without it, a build
      # that silently enabled the Python frontend would pass for the wrong
      # reason.
      - name: Assert C-frontend options survive a Python-off build
        run: |
          help=$(./build/src/esbmc/esbmc --help)
          for opt in --clang-c-irep2-adjust --clang-c-irep2-adjust-only; do
            grep -q -- "$opt" <<<"$help" || {
              echo "::error::$opt missing from a Python-off build"; exit 1; }
          done
          grep -q -- --python-irep2-adjust <<<"$help" && {
            echo "::error::Python options present; this build is not Python-off"
            exit 1; }
          echo "C-frontend options present; Python options absent, as expected."

      # Catch2 registers unit tests by test-case name, so there is no label to
      # select the LD ones by; run their binaries directly.
      - name: Run LD front-end unit tests
        run: |
          for t in ld_parser_test ld_property_test ld_ir_gen_test; do
            ./build/unit/ld-frontend/"$t"
          done

      - name: Run regression/ld
        working-directory: build
        run: ctest -j4 --output-on-failure --progress -L 'ld/'

      - name: Run ld-verify runner tests
        working-directory: build
        run: ctest -j4 --output-on-failure --progress -L ld-verify

  build-linux-amd64:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout ESBMC-PLC+ fork
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential cmake ninja-build git wget curl \
            gcc-12 g++-12 g++-multilib libc6-dev-i386 \
            libboost-all-dev libgmp-dev libssl-dev \
            bison flex python3

      - name: Configure CMake (minimal PLC+ build)
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DDOWNLOAD_DEPENDENCIES=On \
            -DENABLE_BOOLECTOR=Off \
            -DENABLE_YICES=Off \
            -DENABLE_BITWUZLA=Off \
            -DENABLE_GOTO_CONTRACTOR=Off \
            -DBUILD_TESTING=Off \
            -DENABLE_REGRESSION=Off \
            -DENABLE_SOLIDITY_FRONTEND=Off \
            -DENABLE_JIMPLE_FRONTEND=Off \
            -DENABLE_PYTHON_FRONTEND=Off \
            -DENABLE_CSMITH=Off \
            -DENABLE_LD_FRONTEND=On \
            -DENABLE_Z3=On

      - name: Build ESBMC
        run: cmake --build build --target esbmc -j$(nproc)

      - name: Fix RPATH and bundle Z3 library
        run: |
          sudo apt-get install -y patchelf
          Z3_LIB=$(find build/Z3 -name "libz3.so" | head -1)
          echo "Found Z3 lib: $Z3_LIB"
          cp "$Z3_LIB" libz3.so
          patchelf --set-rpath /usr/local/lib build/src/esbmc/esbmc
          cp build/src/esbmc/esbmc esbmc-linux-amd64

      - name: Verify binary supports --ld-props
        run: |
          export LD_LIBRARY_PATH="$(pwd):$LD_LIBRARY_PATH"
          ./esbmc-linux-amd64 --version
          ./esbmc-linux-amd64 --help 2>&1 | grep -q "ld-props" && \
            echo "OK: --ld-props supported" || \
            (echo "FAIL: --ld-props not found in binary" && exit 1)

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: esbmc-linux-amd64
          path: |
            esbmc-linux-amd64
            libz3.so
          retention-days: 30


on:
  workflow_call:
    inputs:
      operating-system:
        description: "Targeted OS (e.g. ubuntu-latest, windows-latest)"
        required: true
        type: string
      build-flags:
        description: "Flags to be passed to build.sh script"
        required: true
        type: string
      testing:
        description: "Whether to run tests (regression) for this build"
        required: true
        type: boolean
      canon-names:
        description: "Upload the build as a canonical esbmc-<platform>.zip release asset"
        required: false
        default: false
        type: boolean
      shadow-fast-lane:
        description: "Time the weekly fast-lane subset before the full suite (esbmc/esbmc#6735)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ESBMC (${{ inputs.operating-system }})
    runs-on: ${{ inputs.operating-system }}
    steps:
    - uses: actions/checkout@v6

    - name: Build ESBMC
      run: ./scripts/build.sh ${{ inputs.build-flags }}

    # Default: upload the raw ./release folder under the flag-qualified name that
    # downstream jobs (benchexec, sv-comp, witness-validation) download verbatim.
    - name: Upload build artifact
      if: ${{ !inputs.canon-names }}
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.operating-system }}-${{ inputs.build-flags }}
        path: ./release

    # Release pipeline (canon-names): emit a canonical esbmc-<platform>.zip so the
    # published asset resolves to releases/latest/download/esbmc-<platform>.zip.
    - name: Package canonical release asset
      if: ${{ inputs.canon-names }}
      run: |
        case "${{ inputs.operating-system }}" in
          ubuntu*) platform=linux ;;
          macos*)  platform=macos ;;
          *)       platform="${{ inputs.operating-system }}" ;;
        esac
        echo "PLATFORM=$platform" >> "$GITHUB_ENV"
        zip -r "esbmc-$platform.zip" ./release
    - name: Upload canonical release asset
      if: ${{ inputs.canon-names }}
      uses: actions/upload-artifact@v7
      with:
        name: esbmc-${{ env.PLATFORM }}
        path: esbmc-${{ env.PLATFORM }}.zip
    
    - name: Check Python regression tests
      if: ${{ inputs.testing == true }}
      run: |
        # Set PATH to include Python 3.12 and user-installed tools (mypy, meson, etc.)
        export PATH="$(brew --prefix python@3.12)/bin:$HOME/Library/Python/3.12/bin:$PATH"
        chmod +x scripts/check_python_tests.sh
        ./scripts/check_python_tests.sh

    # Rollout step 3 of esbmc/esbmc#6735: shadow mode. The subset runs first and
    # cold, which is the condition it would run under in production, and the
    # full suite below then says what the subset missed. Non-blocking -- a
    # measurement must never be the reason a PR goes red.
    - name: Time the fast-lane subset (shadow)
      if: ${{ inputs.testing == true && inputs.shadow-fast-lane == true }}
      continue-on-error: true
      run: |
        week=$(python3 -c 'import datetime; y,w,_ = datetime.date.today().isocalendar(); print(f"{y}-W{w:02d}")')
        echo "FAST_LANE_WEEK=$week" >> "$GITHUB_ENV"
        # Same per-test cap the full run below applies, so the two runs are
        # measured under one timeout regime (ctest --timeout is ignored when
        # tests set TIMEOUT themselves).
        cmake -DESBMC_REGRESS_TIMEOUT=120 build
        # Derived here rather than read from the nightly's committed list: the
        # comparison below is only meaningful if the fast-lane subset and the
        # full run share one universe, and this build's test set can differ
        # from the one that produced ci/test-timings.json. Note this is *not*
        # the nightly's actual selection minus python-intensive:
        # --exclude-prefix filters the universe before the stratified
        # budget/redistribution runs, so the remaining strata get a larger
        # share here than they would in the nightly's own frozen list.
        selection="$RUNNER_TEMP/selected-tests-$week.txt"
        python3 scripts/ci/select_tests.py \
          --timings ci/test-timings.json \
          --build-dir build \
          --week "$week" \
          --budget-seconds 900 \
          --jobs 2 \
          --always-run ci/core-set.txt \
          --exclude-prefix regression/python-intensive/ \
          --output "$selection"
        echo "FAST_LANE_SELECTION=$selection" >> "$GITHUB_ENV"
        start=$(date +%s)
        python3 scripts/ci/run_selected_tests.py \
          --build-dir build \
          --tests "$selection" \
          -j2 --output-junit "$RUNNER_TEMP/fast-lane.xml" || true
        echo "FAST_LANE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        rm -rf /tmp/esbmc-headers-* /tmp/esbmc-test-* /tmp/esbmc-python-astgen-*

    - name: Run tests
      if: ${{ inputs.testing == true }}
      run: |
        # Set PATH to include Python 3.12 and user-installed tools (mypy, meson, etc.)
        export PATH="$(brew --prefix python@3.12)/bin:$HOME/Library/Python/3.12/bin:$PATH"
        cd build/
        # Cap the per-test TIMEOUT property at 120s. ctest --timeout is ignored
        # when tests set TIMEOUT via set_tests_properties (regression/CMakeLists.txt),
        # so we override the cache variable that feeds it and reconfigure.
        cmake -DESBMC_REGRESS_TIMEOUT=120 .
        # macOS PR: the python/ suite (anchored — excludes python-intensive
        # and python-coverage, which already run on Linux), plus the
        # platform-sensitive set. The Python frontend is the one part of ESBMC
        # whose toolchain materially differs across OSes (Homebrew Python,
        # stdlib paths); the rest of the regression suite is platform-portable
        # and covered by the Linux PR job. The exception is behaviour that is
        # genuinely OS-specific — resource limits, threading, signals, memory
        # mapping, filesystem semantics — which passes on Linux and fails on
        # macOS with no signal from CI (#6619). Tests covering that opt in via
        # ESBMC_PLATFORM_SENSITIVE_TESTS in regression/CMakeLists.txt.
        # On PR Linux, skip python-intensive to keep fast feedback.
        # On other systems/events (push, dispatch), run everything.
        #
        # The Linux legs run the full esbmc-cpp suite, which contains
        # memory-heavy container/string cases (e.g. unordered_map/copy_move_fail
        # peaks ~8GB, map/multimap _string_class-2_bug ~3GB each). Under -j4 on a
        # 16GB runner these can align and exhaust RAM, ending the job with a
        # "runner received a shutdown signal" (OOM). Run the Linux legs with -j2
        # to bound peak concurrent memory. The macOS leg runs the light python/
        # suite plus a handful of platform-sensitive tests, and keeps -j4.
        junit=()
        if [[ "${{ inputs.shadow-fast-lane }}" == "true" ]]; then
          junit=(--output-junit "$RUNNER_TEMP/full.xml")
        fi
        if [[ "${{ inputs.operating-system }}" =~ ^macos ]]; then
          ctest -j4 --output-on-failure --progress -L '^python/$|^platform-sensitive$'
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          ctest -j2 --output-on-failure --progress -LE python-intensive "${junit[@]}" .
        else
          ctest -j2 --output-on-failure --progress "${junit[@]}" .
        fi

    - name: Report what the fast lane missed (shadow)
      # always(): the comparison is most interesting precisely when the full
      # suite above went red.
      if: ${{ always() && inputs.testing == true && inputs.shadow-fast-lane == true }}
      continue-on-error: true
      run: |
        test -f "$RUNNER_TEMP/fast-lane.xml" -a -f "$RUNNER_TEMP/full.xml" || {
          echo "shadow: one of the two runs produced no report; nothing to compare"
          exit 0
        }
        python3 scripts/ci/shadow_report.py compare \
          --fast-lane "$RUNNER_TEMP/fast-lane.xml" \
          --full "$RUNNER_TEMP/full.xml" \
          --selection "$FAST_LANE_SELECTION" \
          --fast-lane-seconds "$FAST_LANE_SECONDS" \
          --week "$FAST_LANE_WEEK" \
          --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
          --json "$RUNNER_TEMP/shadow.json" \
          --summary "$GITHUB_STEP_SUMMARY"

    - name: Upload the shadow report
      if: ${{ always() && inputs.testing == true && inputs.shadow-fast-lane == true }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: shadow-report
        path: ${{ runner.temp }}/shadow.json
        retention-days: 30
        if-no-files-found: ignore

# Runs scripts/check_python_tests.sh in its own job, for callers that do not
# run it inside a build job (the parallel Linux PR path and the comparison).

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Commit to check; empty checks the triggering commit"
        required: false
        default: ''
        type: string

jobs:
  check:
    name: Check Python regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.checkout-ref || github.sha }}
    - name: Install the Python runtime
      run: scripts/ci/linux-runtime.sh python
    - name: Check Python regression tests
      run: ./scripts/check_python_tests.sh

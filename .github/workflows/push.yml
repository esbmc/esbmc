name: Master Coverage
on:
  # Nightly, not per-push: the full-suite run takes hours, and every push
  # to master shared one `cancel-in-progress` concurrency group, so a later
  # push killed it. 97 of the last 100 runs were cancelled and master went
  # 8 days with no report.
  schedule:
    - cron: '0 2 * * *'
  # Lets the pipeline be re-run against a known commit, in either mode:
  # fast (minimal cov-regression suite + non-regression tests) or full
  # (the whole regression suite, hours; off-schedule on purpose).
  workflow_dispatch:
    inputs:
      full:
        description: >-
          Run the full regression suite (hours) instead of the minimal
          cov-regression set
        type: choice
        options: [fast, full]
        default: fast

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Coverage (${{ github.event.inputs.full || 'fast' }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event.inputs.full == 'full' && 480 || 180 }}
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies and build with coverage
        env:
          LLVM_PROFILE_FILE: "/tmp/esbmc-coverage/coverage-%m.profraw"
        run: ./scripts/build.sh -b Debug -k ON
      - name: Run tests
        env:
          LLVM_PROFILE_FILE: "/tmp/esbmc-coverage/coverage-%m.profraw"
        # fast: minimal coverage suite (cov-regression) + all non-regression
        # tests (unit + other). Together they cover exactly the lines the
        # full regression suite covers (100% parity, line-level verified).
        # full: the entire suite, for the manual re-baseline.
        run: |
          mkdir -p build/coverage && cd build/ && \
          if [ "${{ github.event.inputs.full }}" = "full" ]; then
            ctest -j4 --progress --timeout 600 . || true
          else
            { ctest -j4 --progress --timeout 600 -LE regression || true; } && \
            { ctest -j4 --progress --timeout 600 -L cov-regression || true; }
          fi
      - name: Map coverage files to instrumented binaries
        # Each %m hash owns one raw file (one per instrumented binary).
        # Re-run each instrumented executable once with a hash-revealing
        # template so raw files can be matched to binaries for per-binary
        # export (unit-test binaries count toward the total, fixing the
        # old esbmc-only counting gap).
        run: |
          set -euo pipefail
          mkdir -p /tmp/esbmc-coverage/hashmap
          bins="build/src/esbmc/esbmc"
          bins+=" $(find build/unit -type f -executable -not -name '*.so*' -not -name '*.a' | tr '\n' ' ')"
          for b in $bins; do
            name=$(echo "$b" | tr '/' '~')
            ( cd "$(dirname "$b")" && \
              LLVM_PROFILE_FILE="/tmp/esbmc-coverage/hashmap/${name}-%m.profraw" \
              timeout 15 "./$(basename "$b")" --cov-hash-probe >/dev/null 2>&1 || true )
          done
      - name: Merge per-binary coverage data
        # A single corrupt profraw (forked test children SIGKILLed mid-flush)
        # aborts a whole-batch merge, so validate file-by-file.
        run: |
          set -uo pipefail
          ok=0; bad=0
          for raw in /tmp/esbmc-coverage/coverage-*.profraw; do
            h=$(basename "$raw" .profraw)
            h=${h#coverage-}
            h=${h%_*} # drop the runtime instance suffix (_0, _1, ...)
            ls /tmp/esbmc-coverage/hashmap/*"-${h}"*.profraw >/dev/null 2>&1 || continue
            if llvm-profdata merge -sparse "$raw" -o "/tmp/esbmc-coverage/${h}.profdata" 2>/dev/null; then
              ok=$((ok+1))
            else
              echo "skipping corrupt profraw: $raw"
              bad=$((bad+1))
            fi
          done
          echo "merged $ok binaries, skipped $bad corrupt files"
          [ "$ok" -gt 0 ]
      - name: Generate lcov coverage report
        # One llvm-cov export per binary (unit-test binaries included, fixing
        # the old esbmc-only counting gap), then a union of the DA records.
        # The union is plain text, not `lcov -a`: lcov sums counts in
        # doubles and mangles hot counters (>= 2^53) into exponential
        # notation, which Codecov rejects.
        run: |
          set -uo pipefail
          for pd in /tmp/esbmc-coverage/*.profdata; do
            h=$(basename "$pd" .profdata)
            m=$(ls /tmp/esbmc-coverage/hashmap/*"-${h}"*.profraw 2>/dev/null | head -1) || continue
            binpath=$(basename "$m" | sed "s/-${h}.*\.profraw//")
            binpath=$(echo "$binpath" | tr '~' '/')
            [ -x "$binpath" ] || { echo "binary missing: $binpath"; continue; }
            llvm-cov export -format=lcov -instr-profile="$pd" "$binpath" \
              > "/tmp/esbmc-coverage/${h}.lcov"
          done
          python3 - /tmp/esbmc-coverage/*.lcov > coverage.info <<'PYEOF'
          import sys
          covered = {}
          for path in sys.argv[1:]:
              sf = None
              for ln in open(path):
                  if ln.startswith("SF:"):
                      sf = ln[3:].strip()
                  elif ln.startswith("DA:") and sf:
                      line, _, count = ln[3:].strip().partition(",")
                      try:
                          hit = int(count) > 0
                      except ValueError:
                          hit = float(count) > 0
                      covered[(sf, line)] = covered.get((sf, line), False) or hit
          cur = None
          for (sf, line), hit in sorted(covered.items(),
                                         key=lambda kv: (kv[0][0], int(kv[0][1]))):
              if sf != cur:
                  if cur is not None:
                      print("end_of_record")
                  print(f"SF:{sf}")
                  cur = sf
              print(f"DA:{line},{1 if hit else 0}")
          if cur is not None:
              print("end_of_record")
          PYEOF
      - name: Filter out uninteresting paths
        run: |
          lcov --ignore-errors inconsistent --ignore-errors corrupt \
               --ignore-errors unused --remove coverage.info \
               '/usr/*' \
               '*/build/*' \
               --output-file coverage.info
      - name: Report line total
        run: lcov --summary coverage.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
      - name: Save coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.info
          retention-days: 5
      - name: Clean tmp files
        run: rm -rf /tmp/esbmc*

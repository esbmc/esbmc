name: Build or install problem
description: ESBMC does not build, install, or run on your platform
labels: [build]
body:
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04 x86_64 / macOS 15 arm64 / Windows 11
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Toolchain and solver versions
      placeholder: LLVM 16, Boost 1.83, Z3 4.13.3
  - type: textarea
    id: command
    attributes:
      label: Commands you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: First error in the log
      render: text
    validations:
      required: true

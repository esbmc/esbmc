coverage:
  precision: 2
  round: down
  range: "50...80"

# Vendored and generated sources, which the coverage jobs in
# .github/workflows/{push,pull_request}.yml do not strip: their lcov --remove
# filters cover only /usr/* and */build/*.
ignore:
  - "src/ansi-c/cpp/**"
  - "src/clang-c-frontend/headers/**"
  - "src/c2goto/library/libm/musl/**"
  - "src/lib/toml.hpp"
  - "build/**"
  - "**/unit/**"

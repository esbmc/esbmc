properties:

  # The stairs_light coil is fed by two parallel branches: the TOF timer output
  # and the latched button toggle. P1 requires the timer branch to reach the
  # coil, P3 requires nothing else to. Together they pin the graphical resolver's
  # handling of function blocks on a rung path and of parallel-path OR. The
  # toggle branch has no property of its own: under sequential evaluation the
  # toggle is set and reset in the same scan (graphical_in_rung_sequential_safe),
  # so no reachable state has it drive the light.

  - id: P1
    kind: invariant
    expression: "!TOF0__Q || stairs_light"
    description: "Timer output energises the light"

  - id: P3
    kind: invariant
    expression: "!stairs_light || TOF0__Q || lights_buttons_state"
    description: "Light is only ever on when the timer or the toggle drives it"

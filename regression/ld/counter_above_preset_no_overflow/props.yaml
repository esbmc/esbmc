properties:

  # CV starts at the INT maximum, as a retained counter value would after a long
  # run. An unbounded CV+1 overflows on the first rising edge, which is UB and
  # wraps CV negative so that Q drops back to false. CTU counts only while
  # CV < PV, so neither the overflow VCC nor P1 is violated.
  - id: P1
    kind: invariant
    expression: "CUQ"
    description: "A counter starting above its preset neither counts nor overflows"

properties:
  # textual_ctd_load_safe with the load pin spelled LOAD, as CODESYS does. LOAD
  # reloads CV from PV (2) before the count, so Empty is off in every scan in
  # which Load is on (#7353).
  - id: P1
    kind: invariant
    expression: "!(Empty && Load)"
    description: "Load is dominant: Empty and Load never hold together"
